[project]
name = "maaden-mro-poc"
version = "0.1.0"
description = "AI-powered MRO inventory intelligence POC for Ma'aden Aluminium (synthetic data)"
requires-python = ">=3.12"

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Pulled in from step 4 onward; the vertical slice does not need them.
engine = [
    "statsforecast>=1.7",     # Croston / SBA / TSB, already implemented and tested
    "scikit-learn>=1.5",      # TF-IDF blocking for the duplicate matcher
    "rapidfuzz>=3.9",         # string scorers for the duplicate matcher
]
report = [
    "python-docx>=1.1",       # the progress document
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
chat = [
    "anthropic>=0.40",        # step 8: the model picks a tool and narrates; it never calculates
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "httpx>=0.27",       # fastapi TestClient; without it tests/test_api.py skips
]

[project.scripts]
mro = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contracts", "sim", "generator", "engine", "scoring"]

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ holds one-shot deck generators, not pipeline code
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
