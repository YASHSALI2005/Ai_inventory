<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Intelligence</title>

<!--
  React, ReactDOM and htm are vendored into static/vendor rather than pulled from a
  CDN. A page that renders blank in a meeting room is worse than no page, and a
  demo laptop on a plant site may have no route to the internet at all. Same files,
  pinned versions, no network. Both charts and every sparkline are inline SVG for
  the same reason.

  Light by default, with a dark theme one click away. The choice is remembered in
  this browser only; the page never reads or writes anything else.
-->
<script src="/static/vendor/react.production.min.js"></script>
<script src="/static/vendor/react-dom.production.min.js"></script>
<script src="/static/vendor/htm.umd.js"></script>

<style>
:root{
  --ground:#F7F5F2; --surface:#FFFFFF; --tint:#F0EDE8; --tint-2:#E8E4DE;
  --ink:#1B1D20; --ink-2:#464B53; --muted:#7B8087; --faint:#A9ADB3;
  --line:#E4E0DA; --line-2:#CFC9C1;
  --accent:#A24E28; --accent-ink:#8A4222; --accent-soft:#F6EAE3;
  --shadow:0 1px 2px rgba(27,29,32,.05),0 6px 20px -10px rgba(27,29,32,.16);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --ground:#14161A; --surface:#1C1F24; --tint:#23272D; --tint-2:#2B3037;
  --ink:#ECEAE6; --ink-2:#C3C0BA; --muted:#8B9098; --faint:#5C6169;
  --line:#2C3138; --line-2:#3A4049;
  --accent:#D9825A; --accent-ink:#E39A78; --accent-soft:#33241C;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ground)}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.mono,td.n,th.n,.num{font-family:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
b{font-weight:600}

/* ── shell ────────────────────────────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
nav{background:var(--surface);border-right:1px solid var(--line);padding:26px 0 20px;
  display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{padding:0 24px 22px;margin-bottom:12px}
.brand .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:600}
.brand .word{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-top:6px;
  line-height:1.15}
.brand .word i{display:inline-block;width:9px;height:9px;border-radius:50%;
  background:var(--accent);margin-right:8px;vertical-align:2px}
nav .step{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;
  padding:10px 24px;font-size:15px;color:var(--ink-2);border-left:3px solid transparent}
nav .step:hover{background:var(--tint)}
nav .step.on{color:var(--ink);font-weight:600;border-left-color:var(--accent);
  background:var(--tint)}
nav .theme-btn{margin:10px 24px 0;padding:8px 14px;border:1px solid var(--line);
  border-radius:4px;font-size:13px;color:var(--muted);background:transparent;
  text-align:left;display:flex;justify-content:space-between;align-items:center}
nav .theme-btn:hover{color:var(--ink);border-color:var(--line-2)}
nav .present-btn{margin:18px 24px 0;padding:9px 14px;border:1px solid var(--line-2);
  border-radius:4px;font-size:13.5px;color:var(--ink-2);background:var(--surface);
  text-align:left;display:flex;justify-content:space-between;align-items:center}
nav .present-btn:hover{border-color:var(--ink-2);color:var(--ink)}
nav .present-btn kbd{font-family:Consolas,monospace;font-size:10.5px;color:var(--faint)}
nav .foot{margin-top:auto;padding:16px 24px 0;border-top:1px solid var(--line);
  font-family:Consolas,monospace;font-size:10.5px;color:var(--faint);line-height:1.8}
main{padding:44px 40px 90px}
.page{max-width:1080px;margin:0 auto}

/* ── type ─────────────────────────────────────────────────────────────────── */
header.ph{margin-bottom:36px}
h1{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.15;
  text-wrap:balance}
.howto{font-size:15px;color:var(--muted);margin-top:10px;max-width:70ch;line-height:1.5}
.howto b{color:var(--ink-2);font-weight:600}
h2{font-size:12px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin:40px 0 14px;display:flex;align-items:center;gap:7px}
.section{margin-top:40px}
.lede-p{font-size:17px;line-height:1.6;color:var(--ink-2);max-width:72ch}
.lede-p b{color:var(--ink)}

/* ── the little i ─────────────────────────────────────────────────────────── */
.info{display:inline-flex;align-items:center;justify-content:center;width:15px;
  height:15px;border-radius:50%;border:1px solid var(--line-2);color:var(--muted);
  font-family:Georgia,serif;font-style:italic;font-size:10px;line-height:1;
  cursor:help;vertical-align:middle;flex:0 0 auto;text-transform:none;
  letter-spacing:0;font-weight:400;background:var(--surface)}
.info:hover,.info:focus{border-color:var(--ink-2);color:var(--ink);outline:none}

/* ── tiles ────────────────────────────────────────────────────────────────── */
.tiles{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.tile{background:var(--surface);border-radius:8px;padding:24px 26px 22px;
  box-shadow:var(--shadow)}
.tile .v{font-family:"Cascadia Mono",Consolas,Menlo,monospace;font-size:40px;
  font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.tile .k{font-size:14px;color:var(--ink-2);margin-top:12px;line-height:1.4;
  display:flex;align-items:center;gap:6px;font-weight:600}
.tile .sub{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.tile .note{font-size:13.5px;line-height:1.55;color:var(--ink-2);margin-top:16px;
  padding-top:14px;border-top:1px solid var(--line)}
.tile.key{background:var(--accent-soft)}
.tile.key .v{color:var(--accent)}

/* ── headline strip ───────────────────────────────────────────────────────── */
.headline{font-size:17px;line-height:1.5;margin:0 0 22px;color:var(--ink-2)}
.headline b{color:var(--ink);font-size:19px}
.headline .acc{color:var(--accent);font-weight:600}

/* ── tables ───────────────────────────────────────────────────────────────── */
.card{background:var(--surface);border-radius:8px;box-shadow:var(--shadow);
  overflow:hidden}
/* Tables are laid out to the card, never wider. Text wraps; numbers do not. A
   horizontal scrollbar on a table is a planner reaching for the mouse to find the
   column that mattered — the one on the right. */
table{border-collapse:collapse;width:100%;font-size:14px;table-layout:fixed}
th{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);text-align:left;padding:14px 16px 12px;
  border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:bottom}
th.n,td.n{text-align:right}
th .info{margin-left:2px}
td{padding:12px 14px;border-bottom:1px solid var(--line);white-space:normal;
  vertical-align:middle;line-height:1.4;overflow-wrap:anywhere}
td.n,td.nw{white-space:nowrap}
th{white-space:normal;line-height:1.3}
th .info{vertical-align:baseline}
tbody tr:last-child td{border-bottom:none}
tr.total td{font-weight:600;border-top:1px solid var(--line-2);background:var(--tint)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--tint)}
.dim{color:var(--muted)}
.strong{font-weight:600;color:var(--ink)}
.acc{color:var(--accent);font-weight:600}
td .sub{font-size:12px;color:var(--muted);margin-top:3px;white-space:normal}
td.item{white-space:normal}
td.item .d{font-weight:500;line-height:1.35}
td.n .u{font-size:11px;color:var(--muted)}
.spark{display:block}

/* ── chips, tags ──────────────────────────────────────────────────────────── */
.chiprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.chiplab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);width:112px;flex:0 0 auto;display:flex;align-items:center;gap:5px;
  font-weight:600}
.chip{border:1px solid var(--line-2);border-radius:16px;padding:6px 14px;
  font-size:13px;background:var(--surface);color:var(--ink-2);white-space:nowrap}
.chip:hover{border-color:var(--ink-2);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
.chip .c{font-family:Consolas,monospace;font-size:11px;opacity:.65;margin-left:7px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:3px;
  white-space:nowrap;background:var(--tint);color:var(--ink-2)}
.act{display:inline-block;font-size:13.5px;font-weight:600;white-space:nowrap;
  color:var(--ink-2)}
.act.hot{color:var(--accent)}
.act.quiet{color:var(--muted);font-weight:400}
.crit{font-family:Consolas,monospace;font-weight:600;color:var(--ink-2)}
.crit.A{color:var(--ink)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
select,input[type=search]{font:inherit;font-size:14px;padding:8px 12px;
  border:1px solid var(--line-2);border-radius:5px;background:var(--surface);
  color:var(--ink)}
input[type=search]{min-width:290px}
.pager{display:flex;gap:10px;align-items:center;justify-content:space-between;
  margin-top:14px;font-size:13.5px;color:var(--muted)}
.pager button{border:1px solid var(--line-2);border-radius:5px;padding:7px 14px;
  background:var(--surface);font-size:13.5px}
.pager button[disabled]{opacity:.4;cursor:default}

.aside{font-size:14px;color:var(--ink-2);line-height:1.6;margin-top:16px;
  padding:14px 18px;background:var(--tint);border-radius:6px;max-width:80ch}
.aside b{color:var(--ink)}
.aside code{font-family:Consolas,monospace;font-size:12.5px;background:var(--surface);
  padding:1px 5px;border-radius:3px}

/* ── the problem page ─────────────────────────────────────────────────────── */
.problem{display:grid;grid-template-columns:1.1fr 1fr;gap:64px;align-items:center;
  min-height:62vh;padding:20px 0}
.problem .words p{font-size:22px;line-height:1.5;color:var(--ink);max-width:30ch;
  text-wrap:balance}
.problem .words p+p{margin-top:22px}
.problem .words p b{color:var(--accent)}
.problem .numbers{display:flex;flex-direction:column;gap:30px}
.problem .big .v{font-family:"Cascadia Mono",Consolas,Menlo,monospace;font-size:52px;
  font-weight:600;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.problem .big .k{font-size:14.5px;color:var(--ink-2);margin-top:8px;font-weight:600}
.problem .big .s{font-size:13px;color:var(--muted);margin-top:3px}
.problem .big.key .v{color:var(--accent)}
.problem-foot{margin-top:38px;padding-top:20px;border-top:1px solid var(--line);
  font-size:15px;color:var(--muted)}

/* ── what's next ──────────────────────────────────────────────────────────── */
.steps{display:flex;flex-direction:column;gap:0;background:var(--surface);
  border-radius:8px;box-shadow:var(--shadow)}
.stepline{display:grid;grid-template-columns:22px 1fr auto;gap:16px;align-items:center;
  padding:16px 22px;border-bottom:1px solid var(--line);font-size:15.5px}
.stepline:last-child{border-bottom:none}
.dot{width:11px;height:11px;border-radius:50%;background:var(--faint)}
.dot.done{background:var(--ink)}
.dot.now{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.stepline .st{font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:600}
.stepline.now .st{color:var(--accent)}

/* ── charts ───────────────────────────────────────────────────────────────── */
.chartbox{background:var(--surface);border-radius:8px;box-shadow:var(--shadow);
  padding:18px 18px 12px;overflow:hidden;position:relative}
.chartbox svg{min-width:0 !important}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--ground);
  font-size:12.5px;line-height:1.45;padding:8px 11px;border-radius:5px;z-index:5;
  box-shadow:0 6px 18px -6px rgba(0,0,0,.5);max-width:260px;transform:translate(-50%,calc(-100% - 12px))}
.tip b{color:var(--ground);font-weight:600}
.tip .mono{font-family:Consolas,monospace;opacity:.9}
.hit{cursor:pointer}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.anim .bar{transform-origin:left center;animation:grow .6s cubic-bezier(.2,.7,.2,1) both}
.anim .col{transform-box:fill-box;transform-origin:bottom;animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.anim .line{stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 1.1s ease-out forwards}
.anim .pt{animation:fade .4s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.anim .bar,.anim .col,.anim .line,.anim .pt{animation:none;stroke-dashoffset:0}}
.storepick{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
/* scenario slider under the frontier */
.scenario{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.scenario .s{background:var(--tint);border-radius:6px;padding:12px 14px}
.scenario .s .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.scenario .s .v{font-family:"Cascadia Mono",Consolas,Menlo,monospace;font-size:20px;font-weight:600;
  margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.scenario .s .d{font-size:12.5px;color:var(--muted);margin-top:3px}
.scenario .s .d b{color:var(--ink-2)}
.scen-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
  margin-top:14px;font-size:14px;color:var(--ink-2)}
.scen-head b{color:var(--accent);font-size:16px}
.scen-head input[type=range]{width:min(420px,100%);accent-color:var(--accent)}
.handle{cursor:grab}
/* chat — a chat window: header, scrolling messages, composer pinned at the bottom */
.chatwin{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);display:flex;
  flex-direction:column;height:calc(100vh - 250px);min-height:520px;overflow:hidden}
.chathead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:.02em;flex:0 0 auto}
.avatar.you{background:var(--tint-2);color:var(--ink-2)}
.chathead .who{font-weight:700;font-size:15px;line-height:1.2}
.chathead .st{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px}
.chathead .st i{width:7px;height:7px;border-radius:50%;background:#3E8E5B;display:inline-block}
.chathead .st i.off{background:var(--faint)}
.chathead .tools{margin-left:auto;display:flex;gap:8px}
.chathead .tools button{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:6px 12px}
.chathead .tools button:hover{color:var(--ink);border-color:var(--line-2)}
.msgs{flex:1;overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:18px;
  background:var(--ground);scroll-behavior:smooth}
.msg{display:flex;gap:12px;align-items:flex-end;max-width:88%}
.msg.you{align-self:flex-end;flex-direction:row-reverse}
.bubble{border-radius:16px;padding:13px 17px;font-size:16px;line-height:1.55;position:relative;min-width:0}
.msg.bot .bubble{background:var(--surface);color:var(--ink);border-bottom-left-radius:4px;box-shadow:var(--shadow)}
.msg.you .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.bot .bubble.err{border-left:3px solid var(--accent)}
.bubble .say b.n{color:var(--accent);font-weight:600}
.bubble .facts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;padding-top:10px;
  border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.bubble .facts .f{background:var(--tint);border-radius:4px;padding:3px 8px;color:var(--ink-2);white-space:nowrap}
.bubble .facts .f b{font-family:Consolas,monospace;color:var(--ink)}
.bubble .facts .lab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-right:2px}
.bubble .rows{margin-top:12px}
.bubble .rows-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:11.5px;
  color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:0 2px 6px}
.bubble .rows-head button{color:var(--accent);font-size:12.5px;text-transform:none;letter-spacing:0;font-weight:600}
.bubble .card{box-shadow:none;border:1px solid var(--line)}
.bubble table{font-size:13.5px}
.bubble td{padding:9px 11px}
.bubble th{padding:10px 11px 8px}
.msg .when{font-size:11px;color:var(--faint);margin-top:5px;padding:0 4px}
.msg.you .when{text-align:right}
.chips-in{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chips-in .chip{font-size:13px;padding:6px 12px;background:var(--tint);border-color:transparent}
.chips-in .chip:hover{border-color:var(--accent);color:var(--accent)}
.typing{display:inline-flex;gap:5px;align-items:center;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.6}}
.composer{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);
  background:var(--surface)}
.composer input{flex:1;font:inherit;font-size:16px;padding:13px 16px;border:1px solid var(--line-2);
  border-radius:24px;background:var(--ground);color:var(--ink)}
.composer input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.composer input:disabled{opacity:.6}
.composer .send{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:flex;
  align-items:center;justify-content:center;flex:0 0 auto}
.composer .send[disabled]{opacity:.35;cursor:default}
.composer .send svg{width:20px;height:20px}
.chatfoot{font-size:12px;color:var(--muted);text-align:center;padding:6px 0 0}
.shell.present .chatwin{height:calc(100vh - 210px)}
.shell.present .bubble{font-size:19px}
.shell.present .composer input{font-size:18px}

/* ── drawer ───────────────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(27,29,32,.36);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,96vw);z-index:41;
  background:var(--ground);overflow-y:auto;box-shadow:-24px 0 60px rgba(27,29,32,.18)}
.drawer .dh{padding:26px 30px 20px;background:var(--surface);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.drawer .dh .do{font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:600;display:flex;align-items:center;gap:12px;
  flex-wrap:wrap}
.drawer .dh .do .act{font-size:20px;text-transform:none;letter-spacing:0}
.drawer .dh .do .cost{font-size:13px;color:var(--muted);letter-spacing:0;
  text-transform:none;font-weight:400}
.drawer .dh .t{font-size:21px;font-weight:700;line-height:1.25;margin-top:12px;
  padding-right:40px;letter-spacing:-.015em}
.drawer .dh .m{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.7}
.drawer .dh .m .crit{font-size:13px}
.drawer .x{position:absolute;top:22px;right:22px;font-size:24px;line-height:1;
  color:var(--muted);padding:2px 8px;border-radius:4px}
.drawer .x:hover{background:var(--tint);color:var(--ink)}
.drawer .body{padding:24px 30px 60px}
.drawer h2{margin-top:30px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--surface);border-radius:8px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:5px;font-weight:600}
.stat .v{font-family:"Cascadia Mono",Consolas,Menlo,monospace;font-size:24px;
  font-weight:600;margin-top:8px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

<body>
<div id="root"></div>

<script>
// Theme first, before anything renders. Light unless this browser chose dark.
(function () {
  let t = "light";
  try { t = localStorage.getItem("theme") || "light"; } catch (e) { /* private window */ }
  document.documentElement.setAttribute("data-theme", t);
})();

// A blank screen in a meeting room is the worst outcome this page can produce, so
// any failure — a script that did not load, a bug in here — is shown instead of
// swallowed.
function fatal(what, err) {
  const root = document.getElementById("root");
  if (root) {
    root.innerHTML =
      '<div class="state"><h3>' + what + "</h3><p>The page could not start. If the server " +
      "has been running for a while, stop it and start it again — the page is newer than " +
      "the server it is talking to.</p><code>" +
      String((err && (err.stack || err.message)) || err) + "</code></div>";
  }
}
window.addEventListener("error", e => fatal("Something went wrong", e.error || e.message));

for (const [name, obj] of [["React", window.React], ["ReactDOM", window.ReactDOM],
                           ["htm", window.htm]]) {
  if (!obj) fatal("Could not load " + name, name + " is not on the page — no network?");
}

const html = htm.bind(React.createElement);
const { useState, useEffect, useCallback } = React;

/* ── numbers ──────────────────────────────────────────────────────────────────
   Money in SAR millions to one decimal, everywhere. Counts with thousands
   separators. Percentages without decimals unless they are under ten.          */
const M = n => {
  if (n === null || n === undefined || Number.isNaN(n)) return "—";
  if (n === 0) return "SAR 0";
  // below a tenth of a million the one-decimal figure reads "0.0m", which is worse
  // than no number; thousands to one decimal is the same rule one step down
  if (Math.abs(n) < 100_000) return "SAR " + (n / 1e3).toFixed(1) + "k";
  const v = n / 1e6;
  if (Math.abs(v) >= 1000) return "SAR " + (v / 1000).toFixed(2) + "bn";
  return "SAR " + v.toFixed(1) + "m";
};
const Mshort = n => M(n).replace("SAR ", "");
const num = n => (n === null || n === undefined ? "—" : Math.round(n).toLocaleString("en-US"));
const num1 = n => (n === null || n === undefined ? "—"
  : (Math.round(n * 10) / 10).toLocaleString("en-US"));
const pct = n => {
  if (n === null || n === undefined || Number.isNaN(n)) return "—";
  const v = n * 100;
  return (Math.abs(v) < 10 ? v.toFixed(1) : Math.round(v).toString()) + "%";
};
// service levels are quoted to one decimal: 99.5% and 99% are different policies
const pct1 = n => (n === null || n === undefined ? "—" : (n * 100).toFixed(1) + "%");
const signPct = n => {
  if (n === null || n === undefined || Number.isNaN(n)) return "—";
  const v = n * 100;
  const body = Math.abs(v) < 10 ? Math.abs(v).toFixed(1) : Math.round(Math.abs(v)).toString();
  return (v < 0 ? "−" : "+") + body + "%";
};
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const monthLabel = (start, i, long) => {
  const [y, m] = start.split("-").map(Number);
  const d = new Date(Date.UTC(y, m - 1 + i, 1));
  return MONTHS[d.getUTCMonth()] + " " + (long ? d.getUTCFullYear() : String(d.getUTCFullYear()).slice(2));
};
const dateShort = iso => {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.getUTCDate() + " " + MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear();
};

const getJSON = url => fetch(url).then(r =>
  r.ok ? r.json() : r.json().then(e => Promise.reject(new Error(e.detail || r.status))));

/* ── the words ────────────────────────────────────────────────────────────────
   Everything a person reads on the four pages is plain English. The technical
   name lives in the tooltip. The evidence page is the exception and says so.    */
const BAND_LABEL = {
  stocked_out: "None left",
  below_reorder: "Below our level",
  below_old_min: "Below the old minimum",
  never_issued: "Never used here",
  idle_24m: "Not used in 2 years",
  well_stocked: "Enough on the shelf",
};
const BAND_ORDER = ["stocked_out", "below_reorder", "below_old_min", "idle_24m",
                    "never_issued", "well_stocked"];
const ACTION = {
  order_now: { label: "Order now", cls: "hot" },
  stocked_elsewhere: { label: "Stocked elsewhere", cls: "hot" },
  below_safe_level: { label: "Below safe level", cls: "" },
  review_obsolete: { label: "Review — obsolete?", cls: "" },
  nothing_needed: { label: "Nothing needed", cls: "quiet" },
};
const ACTION_ORDER = ["order_now", "stocked_elsewhere", "below_safe_level",
                      "review_obsolete", "nothing_needed"];
const CLASS_LABEL = {
  smooth: "Used regularly",
  erratic: "Regular, varying amounts",
  intermittent: "Now and then",
  lumpy: "Rarely, in bursts",
};
const CLASS_TIP = {
  smooth: "Technical name: smooth. Moves most months, in similar amounts.",
  erratic: "Technical name: erratic. Moves most months, but the amount jumps about.",
  intermittent: "Technical name: intermittent. Long gaps between uses, similar amounts each time.",
  lumpy: "Technical name: lumpy. Long gaps between uses, and the amount jumps about — the hardest kind to plan.",
};
const CLASS_ORDER = ["smooth", "erratic", "intermittent", "lumpy"];
const CLASS_SHADE = { smooth: "var(--ink)", erratic: "var(--ink-2)",
                      intermittent: "var(--faint)", lumpy: "var(--line-2)" };

const TIP = {
  reorder: "Our level — when the shelf falls to this number, order more. Set so the part is there the agreed share of the time.",
  on_hand: "How many are on the shelf in this storeroom right now.",
  old_min: "The plant's existing minimum, set by hand years ago.",
  dead: "Stock the plant is very unlikely to use: either the machine it belongs to is gone, or there is more of it than three years of use would justify. Valued at what the books say it is worth.",
  idle: "Parts that have not been issued to any job in the last two years.",
  critical_low: "Parts whose absence stops production, sitting below the level we say is safe.",
  cost_to_level: "What it would cost to buy these back up to their safe level.",
  value_on_shelf: "What is on the shelf, valued at the price the books carry it at.",
  forecast6: "How many we expect to be used in the next six months.",
  last_issued: "The last time this part was given out to a job.",
  crit: "How badly it hurts if this part is missing. A stops production, B slows it, C means somebody waits.",
  class: "How this part moves: steadily, or in occasional bursts. It decides how it is planned.",
  what_to_do: "The one thing to do about this part today.",
  waiting: "Days a storeroom record spent with nothing on the shelf while a job wanted it, added up across the year.",
  storeroom: "One of the five stores: the mine, the refinery, the smelter, the rolling mill, and the central warehouse.",
  moved: "The same part sitting spare in one store while another store is below its safe level.",
  trend: "Units given out in each of the last twelve months, oldest on the left.",
  stock_value: "Everything on every shelf, valued at the price the books carry it at.",
  backtest: "The last year of history replayed twice — once with the plant's levels, once with ours — on the same demand and the same delivery delays.",
  runs_out: "When the shelf reaches zero at the current rate of use.",
  order_by: "The latest day the order can go in and still arrive before the shelf is empty. 'Now' means it is already late.",
  order_cost: "What the whole replenishment order costs — it carries the part past its level to its fill-up target.",
  saved: "What buying this quantity would have cost. Moving it costs nothing but a truck.",
  mix: "How the parts in each store move. Darker is steadier.",
  plantline: "Units given out across the whole plant, every month. The forecast is laid over the last year — the year the system was never shown — so the two can be compared.",
  frontier: "The same year replayed at ten service levels. Right and low is better: fewer days waiting for less capital.",
};

function Info({ text }) {
  return html`<span className="info" title=${text} tabIndex="0" role="img"
    aria-label=${text}>i</span>`;
}
function Tag({ kind, value, tip }) {
  if (!value) return null;
  const label = kind === "b" ? (BAND_LABEL[value] || value)
    : kind === "c" ? (CLASS_LABEL[value] || value) : value;
  return html`<span className="tag" title=${tip || ""}>${label}</span>`;
}
function Action({ value, qty, uom }) {
  const a = ACTION[value] || ACTION.nothing_needed;
  const label = value === "order_now" && qty > 0
    ? "Order " + num1(qty) + " " + (uom || "") : a.label;
  return html`<span className=${"act " + a.cls}>${label}</span>`;
}
function Tile({ label, value, tip, key_, sub, note }) {
  return html`
    <div className=${"tile" + (key_ ? " key" : "")}>
      <div className="v">${value}</div>
      <div className="k">${label}${tip && html` <${Info} text=${tip} />`}</div>
      ${sub && html`<div className="sub">${sub}</div>`}
      ${note && html`<p className="note">${note}</p>`}
    </div>`;
}
function Page({ title, lede, extra, children }) {
  return html`
    <div className="page">
      <header className="ph">
        <h1>${title}</h1>
        ${extra}
        ${lede && html`<div className="howto"><b>How to read this page:</b> ${lede}</div>`}
      </header>
      ${children}
    </div>`;
}
function Spark({ values }) {
  if (!values || !values.length) return null;
  const W = 84, H = 22, n = values.length;
  const peak = Math.max(1, ...values);
  const bw = W / n - 1.6;
  return html`
    <svg className="spark" viewBox=${"0 0 " + W + " " + H} width=${W} height=${H}
         role="img" aria-label="last twelve months of use">
      <line x1="0" x2=${W} y1=${H - 0.5} y2=${H - 0.5} stroke="var(--line-2)" />
      ${values.map((v, i) => html`
        <g key=${i}>
          <title>${num1(v)} — ${i === n - 1 ? "last month" : (n - 1 - i) + " months ago"}</title>
          <rect x=${i * (W / n)} width=${W / n} y="0" height=${H} fill="transparent" />
          <rect x=${i * (W / n) + 0.8} width=${bw}
                y=${H - 1 - (v / peak) * (H - 3)} height=${Math.max(0.6, (v / peak) * (H - 3))}
                fill=${i === n - 1 ? "var(--ink)" : "var(--faint)"} />
        </g>`)}
    </svg>`;
}
/* ── 5 · chat ─────────────────────────────────────────────────────────────── */
const STORE_WORDS = { BAITHA: "the mine store", CENTRAL: "the central warehouse", REFINERY: "the refinery",
                      ROLLING: "the rolling mill", SMELTER: "the smelter" };
const CAPS = [
  { tool: "get_stockouts", title: "What is out of stock",
    hint: "By store, by how critical the part is. Count, cost to bring back to level, the most urgent rows.",
    ask: "Which A-critical parts are out of stock in the rolling mill?",
    follow: ["What is out of stock in the smelter?", "How much would it cost to bring everything below level back up?"] },
  { tool: "get_dead_money", title: "Where the dead money is",
    hint: "Stock that will never be used — obsolete, duplicate, never used, idle, excess — by store or by reason.",
    ask: "How much dead money is there, and what is the biggest item?",
    follow: ["What stock belongs to equipment that has been scrapped?", "How much dead money is in the central warehouse?"] },
  { tool: "get_item", title: "Everything about one part",
    hint: "On hand, our level against the old rule, what to do, and the reason in plain words.",
    ask: "Tell me about M-016367.",
    follow: ["What is our reorder point for M-000002 and why?"] },
  { tool: "get_transfers", title: "Move instead of buy",
    hint: "The same part spare in one store while another is short, with what the move saves.",
    ask: "What could the refinery get from another store instead of buying?",
    follow: ["How much would we save by moving stock instead of buying it?"] },
];
const CAP_BY_TOOL = Object.fromEntries(CAPS.map(c => [c.tool, c]));
const SUGGESTED = CAPS.map(c => c.ask);

// figures in the narration are the checkable part; make them stand out
function Say({ text }) {
  // digits inside a part id (M-016367) are a name, not a figure
  const parts = String(text || "").split(/(SAR\s?[\d.,]+\s?(?:million|billion|bn|m|k)?|(?<![A-Z]-)\b\d[\d,]*(?:\.\d+)?%?)/g);
  return html`<div className="say">${parts.map((p, i) => i % 2 ? html`<b key=${i} className="n">${p}</b>` : p)}</div>`;
}

function scopeWords(tool, args) {
  const a = args || {}, out = [];
  if (a.storeroom) out.push(STORE_WORDS[a.storeroom] || a.storeroom);
  if (a.storeroom_id) out.push(STORE_WORDS[a.storeroom_id] || a.storeroom_id);
  if (a.criticality) out.push(a.criticality + "-critical");
  if (a.category) out.push(({ obsolete_equipment: "equipment gone", duplicate: "duplicates", never_used: "never used",
                             obsolete_idle: "idle, nothing due", excess: "excess" })[a.category] || a.category);
  if (a.material_id) out.push(a.material_id);
  if (a.top_n && a.top_n !== 10) out.push("top " + a.top_n);
  return out.length ? out.join(" · ") : "whole plant";
}

function Facts({ tool, args, result }) {
  if (!result) return null;
  const f = [];
  if (result.count !== undefined) f.push(["rows found", num(result.count)]);
  if (result.none_left !== undefined) f.push(["none left", num(result.none_left)]);
  if (result.cost_to_level_sar !== undefined) f.push(["to bring back to level", M(result.cost_to_level_sar)]);
  if (result.dead_value_sar !== undefined) f.push(["dead value", M(result.dead_value_sar)]);
  if (result.saved_sar !== undefined) f.push(["saved vs buying", M(result.saved_sar)]);
  const cap = CAP_BY_TOOL[tool];
  return html`
    <div className="facts">
      <span className="lab">Answered from</span>
      <span className="f">${cap ? cap.title : tool} · ${scopeWords(tool, args)}</span>
      ${f.map(([k, v]) => html`<span key=${k} className="f">${k} <b>${v}</b></span>`)}
      <span style=${{ marginLeft: "auto" }}>every figure above is in these</span>
    </div>`;
}

function RowsTable({ rows, setOpen }) {
  const [all, setAll] = useState(false);
  if (!rows || !rows.length) return null;
  const isDead = "dead_value_sar" in rows[0], isMove = "from_storeroom" in rows[0];
  const shown = all ? rows : rows.slice(0, 5);
  return html`
    <div className="rows">
      <div className="rows-head">
        <span>The rows behind this · click one to open it</span>
        ${rows.length > 5 && html`<button onClick=${() => setAll(!all)}>${all ? "First five" : "All " + rows.length}</button>`}
      </div>
      <div className="card"><table>
        ${isMove ? html`<colgroup><col style=${{ width: "44%" }} /><col style=${{ width: "22%" }} /><col style=${{ width: "14%" }} /><col style=${{ width: "20%" }} /></colgroup>`
          : isDead ? html`<colgroup><col style=${{ width: "42%" }} /><col style=${{ width: "14%" }} /><col style=${{ width: "24%" }} /><col style=${{ width: "20%" }} /></colgroup>`
          : html`<colgroup><col style=${{ width: "34%" }} /><col style=${{ width: "12%" }} /><col style=${{ width: "18%" }} /><col style=${{ width: "12%" }} /><col style=${{ width: "12%" }} /><col style=${{ width: "12%" }} /></colgroup>`}
        <thead><tr>
          <th>Part</th>

          ${m.tool && html`<${Facts} tool=${m.tool} args=${m.args} result=${m.result} />`}
          ${m.rows && m.rows.length > 0 && html`<${RowsTable} rows=${m.rows} setOpen=${setOpen} />`}

const WELCOME = ready => ({
  role: "bot", at: new Date(), chips: ready ? SUGGESTED : [],
  text: ready
    ? "Hello. I can answer four kinds of question about the storerooms: what is out of stock, where the dead money is, everything about one part, and what could be moved instead of bought. Every figure I give you comes from a result the system has already written, and I will show you the rows it came from. Try one of these, or type your own."
    : "Hello. I am not available right now — there is no API key. Set ANTHROPIC_API_KEY in the environment the server runs in, or in a .env file next to cli.py, and restart it. Everything else on these pages works without me.",
});

function Chat({ setOpen, ask: preset }) {
  const [status, setStatus] = useState(null);
  const [q, setQ] = useState("");
  const [busy, setBusy] = useState(false);
  const [msgs, setMsgs] = useState([]);
  const endRef = React.useRef(null);
  const inputRef = React.useRef(null);

  useEffect(() => {
    getJSON("/api/chat/status").then(setStatus).catch(() => setStatus({ available: false }));
  }, []);
  useEffect(() => { if (status) setMsgs([WELCOME(status.available)]); }, [status]);
  useEffect(() => { if (preset && status && status.available && msgs.length === 1) ask(preset); }, [preset, status, msgs.length]);
  useEffect(() => { if (endRef.current) endRef.current.scrollIntoView({ block: "end" }); }, [msgs, busy]);

  const ready = status && status.available;

  const ask = text => {
    const question = (text || q).trim();
    if (!question || busy || !ready) return;
    // the last few exchanges go with the question so "and in the smelter?" makes sense
    const history = [];
    for (let i = 0, pair = null; i < msgs.length; i++) {
      const m = msgs[i];
      if (m.role === "you") pair = { question: m.text };
      else if (pair && m.text && !m.chips) { pair.answer = m.text; history.push(pair); pair = null; }
    }
    setBusy(true); setQ("");
    setMsgs(ms => [...ms, { role: "you", text: question, at: new Date() }, { role: "bot", typing: true, at: new Date() }]);
    fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
                         body: JSON.stringify({ question, history: history.slice(-6) }) })
      .then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(new Error(e.detail || r.status))))
      .then(a => setMsgs(ms => [...ms.slice(0, -1), { role: "bot", at: new Date(), text: a.answer || a.detail,
                                                   tool: a.tool, args: a.args, result: a.result, rows: a.rows || [],
                                                   error: a.status !== "ok" }]))
      .catch(e => setMsgs(ms => [...ms.slice(0, -1), { role: "bot", at: new Date(), error: true,
                                                    text: "I could not answer that: " + String(e.message || e) }]))
      .finally(() => { setBusy(false); if (inputRef.current) inputRef.current.focus(); });
  };

  return html`
    <${Page} title="Ask"
             lede=${"a chat with the storeroom data. The assistant answers only from results "
                    + "the system has already written and shows the rows behind every answer. "
                    + "It never does arithmetic — if a number is not in the results, it says so."}>
      <div className="chatwin">
        <div className="chathead">
          <div className="avatar">✦</div>
          <div><div className="who">Inventory assistant</div>
            <div className="st"><i className=${ready ? "" : "off"}></i>
              ${status ? (ready ? "reads results/ only · " + (status.model || "") : "unavailable — no key") : "connecting…"}</div></div>
          <div className="tools">
            ${msgs.length > 1 && html`<button onClick=${() => setMsgs([WELCOME(ready)])}>New chat</button>`}
          </div>
        </div>
        <div className="msgs">
          ${msgs.map((m, i) => html`<${Message} key=${i} m=${m} setOpen=${setOpen} ask=${ask} busy=${busy} />`)}
          <div ref=${endRef}></div>
        </div>
        <div className="composer">
          <input ref=${inputRef} type="text" value=${q} autoFocus
                 placeholder=${ready ? "Ask about stock-outs, dead money, one part, or moves between stores…" : "Assistant unavailable"}
                 onInput=${e => setQ(e.target.value)}
                 onKeyDown=${e => { if (e.key === "Enter") ask(); if (e.key === "Escape") setQ(""); }}
                 disabled=${!ready || busy} />
          <button className="send" onClick=${() => ask()} disabled=${!ready || busy || !q.trim()} aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M5 12h13M13 6l6 6-6 6" /></svg>
          </button>
        </div>
      </div>
      <div className="chatfoot">Answers are read back from precomputed results — the assistant chooses which result, it does not calculate.</div>
    <//>`;
}

function Loading() {
  return html`<div className="state"><h3><span className="pulse"></span>Loading</h3>

  return html`<div className="state"><h3>${what}</h3>

}

/* ── charts ────────────────────────────────────────────────────────────────────
   All inline SVG, one style: thin axes, muted gridlines, one series highlighted.
   Every chart answers the pointer: a tooltip with the exact figures, and a click
   where there is somewhere to go.                                                */
function useTip() {
  const [tip, setTip] = useState(null);
  const show = (e, content) => {
    const box = e.currentTarget.closest(".chartbox") || e.currentTarget.parentElement;
    const r = box.getBoundingClientRect();
    setTip({ x: e.clientX - r.left, y: e.clientY - r.top, content });
  };
  const hide = () => setTip(null);
  const node = tip ? html`<div className="tip" style=${{ left: tip.x + "px", top: tip.y + "px" }}>${tip.content}</div>` : null;
  return [show, hide, node];
}

function Bars({ rows, fmt, picked, onPick }) {

/* Plant-wide monthly usage as a line, with the forecast laid over the last twelve
   months — the year the system was never shown — so the two can be compared.    */
function PlantLine({ plant }) {
  const [hover, setHover] = useState(null);
  const [show, hide, tipNode] = useTip();
  if (!plant) return null;
  const W = 1000, H = 250, L = 64, R = 20, T = 18, B = 40;
  const iw = W - L - R, ih = H - T - B;
  const u = plant.usage_months, f = plant.forecast_months, n = u.length, tm = plant.train_months;
  const ahead = plant.forward_months || [];
  const total = n + ahead.length;
  const peak = Math.max(1, ...u, ...f.map((v, i) => v + (plant.known_months[i] || 0)), ...ahead);
  const X = i => L + (i / (total - 1)) * iw;
  const Y = v => T + ih - (v / peak) * ih;
  const line = pts => pts.map((p, i) => (i ? "L" : "M") + X(p.i).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ");
  const usagePath = line(u.map((v, i) => ({ i, v })));
  const fcPath = line(f.map((v, i) => ({ i: tm + i, v: v + (plant.known_months[i] || 0) })));
  // the year ahead starts from the last actual month so the line is continuous
  const aheadPath = ahead.length
    ? line([{ i: n - 1, v: u[n - 1] }].concat(ahead.map((v, i) => ({ i: n + i, v })))) : "";
  const ticks = [];
  for (let i = 0; i < total; i += 6) ticks.push(i);
  const onMove = e => {
    const svg = e.currentTarget;
    const box = svg.getBoundingClientRect();
    const px = ((e.clientX - box.left) / box.width) * W;
    const i = Math.max(0, Math.min(total - 1, Math.round(((px - L) / iw) * (total - 1))));
    setHover(i);
    const fi = i - tm;
    const exp = fi >= 0 && fi < f.length ? f[fi] + (plant.known_months[fi] || 0) : null;
    const ai = i - n;
    show(e, i < n
      ? html`<b>${monthLabel(plant.months_start, i, true)}</b><br/>
          <span className="mono">${num(u[i])}</span> given out
          ${exp !== null ? html`<br/><span className="mono">${num(exp)}</span> expected` : ""}`
      : html`<b>${monthLabel(plant.months_start, i, true)}</b> · year ahead<br/>
          <span className="mono">${num(ahead[ai])}</span> expected`);
  };
  return html`
    <div className="anim">
      <svg viewBox=${"0 0 " + W + " " + H} width="100%" style=${{ display: "block" }}
           role="img" aria-label="plant-wide monthly usage and forecast"
           onMouseMove=${onMove} onMouseLeave=${() => { setHover(null); hide(); }}>
        ${[0, 0.5, 1].map(fr => html`
          <g key=${fr}>
            <line x1=${L} x2=${W - R} y1=${Y(peak * fr)} y2=${Y(peak * fr)} stroke="var(--line)" />
            <text x=${L - 10} y=${Y(peak * fr) + 4} textAnchor="end" fill="var(--muted)" fontSize="11"
                  fontFamily="Consolas,monospace">${num(peak * fr)}</text>
          </g>`)}
        <rect x=${X(tm)} y=${T} width=${X(n - 1) - X(tm)} height=${ih} fill="var(--tint)" opacity="0.7" />
        <line x1=${X(tm)} x2=${X(tm)} y1=${T} y2=${T + ih} stroke="var(--ink)" strokeDasharray="4 3" />
        <text x=${X(tm) + 6} y=${T + 12} fill="var(--muted)" fontSize="11" fontFamily="Consolas,monospace">learned up to here</text>
        ${ahead.length > 0 && html`
          <line x1=${X(n - 1)} x2=${X(n - 1)} y1=${T} y2=${T + ih} stroke="var(--muted)" strokeDasharray="2 3" />
          <text x=${X(n - 1) + 6} y=${T + 12} fill="var(--muted)" fontSize="11" fontFamily="Consolas,monospace">data ends · year ahead</text>`}
        <path className="line" d=${usagePath} fill="none" stroke="var(--ink-2)" strokeWidth="1.8" />
        <path className="line" d=${fcPath} fill="none" stroke="var(--accent)" strokeWidth="2.2" />
        ${aheadPath && html`<path className="line" d=${aheadPath} fill="none" stroke="var(--accent)" strokeWidth="2.2" strokeDasharray="6 4" />`}
        <line x1=${L} x2=${W - R} y1=${T + ih} y2=${T + ih} stroke="var(--line-2)" />
        ${ticks.map(i => html`
          <text key=${i} x=${X(i)} y=${H - 14} textAnchor="middle" fill="var(--muted)" fontSize="11"
                fontFamily="Consolas,monospace">${monthLabel(plant.months_start, i)}</text>`)}
        ${hover !== null && html`
          <g>
            <line x1=${X(hover)} x2=${X(hover)} y1=${T} y2=${T + ih} stroke="var(--muted)" strokeDasharray="2 3" />
            ${hover < n && html`<circle cx=${X(hover)} cy=${Y(u[hover])} r="4" fill="var(--ink)" />`}
            ${hover >= tm && (hover - tm) < f.length && html`
              <circle cx=${X(hover)} cy=${Y(f[hover - tm] + (plant.known_months[hover - tm] || 0))} r="4" fill="var(--accent)" />`}
            ${hover >= n && html`<circle cx=${X(hover)} cy=${Y(ahead[hover - n])} r="4" fill="var(--accent)" />`}
          </g>`}
      </svg>
      ${tipNode}
      <div className="legend">
        <span><i style=${{ background: "var(--ink-2)" }}></i>units given out</span>
        <span><i style=${{ background: "var(--accent)" }}></i>what the system expected for the last year, including scheduled work</span>
        ${ahead.length > 0 && html`<span><i style=${{ background: "var(--accent)", opacity: .55 }}></i>the year ahead — refitted on all three years, not yet gradeable</span>`}
      </div>
    </div>`;
}

function Frontier({ fr, compact, handle, onDrag, pts: sorted, t }) {
  const [show, hide, tipNode] = useTip();
  const [drag, setDrag] = useState(false);
  if (!fr || !fr.curve) return null;
  const W = 1000, H = compact ? 300 : 340, L = 86, R = 170, T = 20, B = 56;
  const iw = W - L - R, ih = H - T - B;
  const pts = fr.curve.map(r => ({ x: r.stockout_days, y: r.avg_capital_sar, s: r.service_level }));
  const plant = { x: fr.baseline.stockout_days, y: fr.baseline.avg_capital_sar };
  const ours = { x: fr.recommended.stockout_days, y: fr.recommended.avg_capital_sar };
  const xs = pts.concat([plant, ours]).map(p => p.x), ys = pts.concat([plant, ours]).map(p => p.y);
  const x0 = 0, x1 = Math.max(...xs) * 1.06;
  const y0 = Math.min(...ys) * 0.92, y1 = Math.max(...ys) * 1.04;
  const X = v => L + ((v - x0) / (x1 - x0)) * iw;
  const Y = v => T + ih - ((v - y0) / (y1 - y0)) * ih;
  const path = pts.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
  const ticksY = [0, 0.25, 0.5, 0.75, 1].map(f => y0 + (y1 - y0) * f);
  const ticksX = [0, 0.25, 0.5, 0.75, 1].map(f => x0 + (x1 - x0) * f);
  const tipFor = (label, r) => html`<b>${label}</b><br/>
    <span className="mono">${num(r.stockout_days)}</span> days waiting<br/>
    <span className="mono">${M(r.avg_capital_sar)}</span> on the shelves<br/>
    <span className="mono">${M(r.total_cost_sar)}</span> all costs together`;
  // dragging: the pointer's x is mapped to the nearest position along the sorted
  // curve, expressed as the slider's 0..(n-1)*100 parameter
  const toParam = e => {
    if (!sorted) return null;
    const box = e.currentTarget.getBoundingClientRect();
    const px = ((e.clientX - box.left) / box.width) * W;
    const xs = sorted.map(p => X(p.stockout_days));
    let best = 0, bestD = Infinity;
    for (let k = 0; k < xs.length - 1; k++) {
      const a = xs[k], b = xs[k + 1];
      const f = Math.max(0, Math.min(1, (px - a) / ((b - a) || 1e-9)));
      const dist = Math.abs(a + (b - a) * f - px);
      if (dist < bestD) { bestD = dist; best = (k + f) * 100; }
    }
    return Math.round(best);
  };
  const dragStart = e => { if (onDrag) { setDrag(true); const p = toParam(e); if (p !== null) onDrag(p); } };
  const dragMove = e => { if (drag && onDrag) { const p = toParam(e); if (p !== null) onDrag(p); } };
  const dragEnd = () => setDrag(false);
  return html`
    <div className="anim">
      <svg viewBox=${"0 0 " + W + " " + H} width="100%" style=${{ display: "block", touchAction: "none" }}
           role="img" aria-label="value on the shelves against days waiting"
           onPointerDown=${dragStart} onPointerMove=${dragMove} onPointerUp=${dragEnd} onPointerLeave=${dragEnd}>
        ${ticksY.map((v, i) => html`
          <g key=${"y" + i}>
            <line x1=${L} x2=${W - R} y1=${Y(v)} y2=${Y(v)} stroke="var(--line)" />

/* The scenario slider. The handle moves along the measured curve; the four figures
   are linear interpolation between the two nearest sampled points of the SAME
   replay, so nothing is computed live and nothing can disagree with the evidence
   page. Deltas are against the plant's own levels today.                        */
function Scenario({ fr }) {
  const pts = fr.curve.slice().sort((a, b) => a.service_level - b.service_level);
  const ours = fr.recommended, plant = fr.baseline;
  const startAt = () => {
    // open on the sampled point nearest our recommendation's total cost
    let k = 0;
    pts.forEach((p, i) => { if (Math.abs(p.total_cost_sar - ours.total_cost_sar) < Math.abs(pts[k].total_cost_sar - ours.total_cost_sar)) k = i; });
    return k * 100;
  };
  const [t, setT] = useState(startAt);          // 0 .. (n-1)*100
  const n = pts.length;
  const i = Math.min(n - 2, Math.floor(t / 100)), f = t / 100 - i;
  const lerp = k => pts[i][k] + (pts[i + 1][k] - pts[i][k]) * f;
  const at = { service_level: lerp("service_level"), stockout_days: lerp("stockout_days"),
               avg_capital_sar: lerp("avg_capital_sar"), total_cost_sar: lerp("total_cost_sar"),
               orders_placed: lerp("orders_placed") };
  const d = (k, money) => {
    const v = (at[k] - plant[k]) / plant[k];
    return html`<div className="d"><b>${signPct(v)}</b> vs the plant today${money ? " (" + M(plant[k]) + ")" : " (" + num(plant[k]) + ")"}</div>`;
  };
  return html`
    <div>
      <${Frontier} fr=${fr} compact handle=${at} onDrag=${x => setT(x)} pts=${pts} t=${t} />
      <div className="scen-head">
        <span>Every part held to <b>${pct1(at.service_level)}</b> service</span>
        <input type="range" min="0" max=${(n - 1) * 100} value=${t} onInput=${e => setT(+e.target.value)}
               aria-label="service level" />
        <span className="dim">ours, per part: ${M(ours.avg_capital_sar)} · ${num(ours.stockout_days)} days · ${M(ours.total_cost_sar)}</span>
      </div>
      <div className="scenario">
        <div className="s"><div className="k">Value on the shelves</div><div className="v">${M(at.avg_capital_sar)}</div>${d("avg_capital_sar", true)}</div>
        <div className="s"><div className="k">Days waiting for a part</div><div className="v">${num(at.stockout_days)}</div>${d("stockout_days")}</div>
        <div className="s"><div className="k">All costs together</div><div className="v">${M(at.total_cost_sar)}</div>${d("total_cost_sar", true)}</div>
        <div className="s"><div className="k">Purchase orders</div><div className="v">${num(at.orders_placed)}</div>${d("orders_placed")}</div>
      </div>
    </div>`;
}

/* The drawer's chart. Forecast laid OVER the last twelve months, not after them —
   those twelve are the year the system was tested on, and the point of the
   picture is that the two series can be compared.                              */
function UsageChart({ usage, forecast, planned, trainMonths, startMonth, uom }) {
  const [show, hide, tipNode] = useTip();
  const W = 660, H = 210, L = 50, R = 14, T = 14, B = 34;
  const n = usage.length, iw = W - L - R, ih = H - T - B;
  const step = iw / Math.max(n, 1);
  const peak = Math.max(1, ...usage, ...forecast.map((f, i) => f + (planned[i] || 0)));
  const y = v => T + ih - (v / peak) * ih;
  const bw = Math.max(1.5, step * 0.64);
  const cutX = L + trainMonths * step;
  const fcPath = forecast.map((v, i) => (i ? "L" : "M") + (L + (trainMonths + i) * step + step / 2).toFixed(1)
                                        + " " + y(v + (planned[i] || 0)).toFixed(1)).join(" ");
  const ticks = [];
  for (let i = 0; i < n; i += 6) ticks.push(i);
  const onMove = e => {
    const box = e.currentTarget.getBoundingClientRect();
    const px = ((e.clientX - box.left) / box.width) * W;
    const i = Math.max(0, Math.min(n - 1, Math.floor((px - L) / step)));
    const fi = i - trainMonths;
    const exp = fi >= 0 && fi < forecast.length ? forecast[fi] + (planned[fi] || 0) : null;
    show(e, html`<b>${monthLabel(startMonth, i, true)}</b><br/><span className="mono">${num1(usage[i])}</span> ${uom} given out
      ${exp !== null ? html`<br/><span className="mono">${num1(exp)}</span> expected` : ""}`);
  };
  return html`
    <div className="chartbox anim">
      <svg viewBox=${"0 0 " + W + " " + H} width="100%" style=${{ display: "block" }}
           role="img" aria-label="monthly usage and forecast" onMouseMove=${onMove} onMouseLeave=${hide}>
        ${[0, 0.5, 1].map(f => html`
          <g key=${f}>
            <line x1=${L} x2=${W - R} y1=${y(peak * f)} y2=${y(peak * f)} stroke="var(--line)" />
            <text x=${L - 8} y=${y(peak * f) + 4} textAnchor="end" fill="var(--muted)" fontSize="11"
                  fontFamily="Consolas,monospace">${num1(peak * f)}</text>
          </g>`)}
        <rect x=${cutX} y=${T} width=${L + n * step - cutX} height=${ih} fill="var(--tint)" opacity="0.7" />
        ${usage.map((v, i) => v > 0 && html`
          <rect key=${"u" + i} className="col" x=${L + i * step + (step - bw) / 2} y=${y(v)} width=${bw}
                height=${Math.max(1, T + ih - y(v))} fill="var(--ink-2)" style=${{ animationDelay: (i * 12) + "ms" }} />`)}
        ${forecast.length > 0 && html`<path className="line" d=${fcPath} fill="none" stroke="var(--accent)" strokeWidth="2.2" />`}
        ${forecast.map((v, i) => html`
          <circle key=${"c" + i} cx=${L + (trainMonths + i) * step + step / 2} cy=${y(v + (planned[i] || 0))}
                  r="2.6" fill="var(--accent)" />`)}
        ${planned.map((p, i) => p > 0 && html`
          <rect key=${"s" + i} x=${L + (trainMonths + i) * step + (step - bw) / 2} y=${y(p)} width=${bw}
                height=${Math.max(2, T + ih - y(p))} fill="none" stroke="var(--accent)" strokeWidth="1.4"
                strokeDasharray="3 2" />`)}
        <line x1=${cutX} x2=${cutX} y1=${T} y2=${T + ih} stroke="var(--ink)" strokeWidth="1" strokeDasharray="4 3" />
        <text x=${cutX + 5} y=${T + 11} fill="var(--muted)" fontSize="11" fontFamily="Consolas,monospace">learned up to here</text>
        <line x1=${L} x2=${W - R} y1=${T + ih} y2=${T + ih} stroke="var(--line-2)" />
        ${ticks.map(i => html`
          <text key=${"t" + i} x=${L + i * step + step / 2} y=${H - 16} textAnchor="middle" fill="var(--muted)"
                fontSize="11" fontFamily="Consolas,monospace">${monthLabel(startMonth, i)}</text>`)}
        <text x=${L} y=${H - 3} fill="var(--muted)" fontSize="11" fontFamily="Consolas,monospace">${uom} per month</text>
      </svg>
      ${tipNode}
      <div className="legend">
        <span><i style=${{ background: "var(--ink-2)" }}></i>given out</span>
        <span><i style=${{ background: "var(--accent)" }}></i>what the system expected for the last year</span>
        <span><i style=${{ border: "1.5px dashed var(--accent)", background: "transparent" }}></i>scheduled work — planned jobs and outages already in the calendar</span>
      </div>
    </div>`;
}

/* ── evidence (footer link) ───────────────────────────────────────────────── */
function Scoreboard({ data }) {
  const rows = data.by_type || [], s = data.summary || {};
  const rate = v => (v === null || v === undefined || Number.isNaN(v) ? "—" : pct(v));
  const recall = r => (r.planted ? r.found / r.planted : null);
  const prec = r => (r.found + r.false_alarms ? r.found / (r.found + r.false_alarms) : null);
  return html`
    <div className="card"><table>
      <thead><tr><th>Defect type</th><th className="n">Planted</th><th className="n">Found</th>
        <th className="n">Missed</th><th className="n">False alarms</th><th className="n">Recall</th><th className="n">Precision</th></tr></thead>
      <tbody>
        ${rows.map(r => html`
          <tr key=${r.defect_type}>
            <td className="mono">${r.defect_type}</td>
            <td className="n">${r.planted}</td><td className="n">${r.found}</td>
            <td className=${"n " + (r.missed ? "strong" : "dim")}>${r.missed}</td>
            <td className=${"n " + (r.false_alarms ? "strong" : "dim")}>${r.false_alarms}</td>
            <td className="n">${rate(recall(r))}</td><td className="n">${rate(prec(r))}</td>
          </tr>`)}
        <tr className="total"><td>Total — checks that ran</td>
          <td className="n">${s.planted}</td><td className="n">${s.found}</td><td className="n">${s.missed}</td>
          <td className="n">${s.false_alarms}</td><td className="n">${rate(s.recall)}</td><td className="n">${rate(s.precision)}</td></tr>
      </tbody>
    </table></div>`;
}

function Evidence({ summary, score, bt, fc, fr }) {
  const b = (bt && bt.baseline) || {}, p = (bt && bt.policy) || {}, ch = (bt && bt.change) || {};
  const s = score.summary || {};
  const zeroLosers = ((fc && fc.mase_by_class) || []).filter(r => r.mase >= r.zero).map(r => r.class);
  const beatNaive = ((fc && fc.mase_by_class) || []).every(r => r.mase < r.naive);
  const run = summary.run;
  const row = (label, key, money) => html`
    <tr key=${key}><td>${label}</td>
      <td className="n">${money ? M(b[key]) : num(b[key])}</td>
      <td className="n">${money ? M(p[key]) : num(p[key])}</td>
      <td className=${"n " + (ch[key] < 0 ? "strong" : "dim")}>${signPct(ch[key])}</td></tr>`;
  return html`
    <${Page} title="Evidence"
             lede=${"written for engineers. This is the only page that uses technical "
                    + "words. Every figure is graded against something: a sealed answer "
                    + "key, or a year the system never saw."}>
      <p className="lede-p">
        In plain words: of the ${num(s.planted)} faults hidden in the data, the checks found
        ${" "}<b>${pct(s.recall)}</b> and raised false alarms on <b>${num(s.false_alarms)}</b> records.
        The forecasts beat "repeat last year" ${beatNaive ? "on every kind of part" : "on most kinds of part"}.
        When the last year was replayed under our stock levels instead of the plant's, jobs waited
        ${" "}<b>${signPct(ch.stockout_days).slice(1)} fewer days</b> for parts, the shelves held
        ${" "}<b>${signPct(ch.avg_capital_sar)}</b> more stock, and the three costs together came out
        ${" "}<b>${signPct(ch.total_cost_sar)}</b>. That trade — more stock, much less waiting, lower
        total cost — is the one the rest of this page defends.
      </p>
      <h2>Finding the faults — graded against the sealed answer key</h2>
      <${Scoreboard} data=${score} />
      <div className="aside">Faults were planted in the invented data and the list sealed away. The engine
        never reads it; the scoring step does. <b>Recall</b> is how many planted faults were found,
        <b>precision</b> how many of the reports were real.</div>

      ${fc && html`
        <h2>Forecast accuracy on the held-out year</h2>
        <div className="card"><table>
          <thead><tr><th>Demand class</th><th className="n">Records</th><th>Method</th>
            <th className="n">MASE, ours</th><th className="n">Repeat last year</th><th className="n">Always zero</th></tr></thead>
          <tbody>${fc.mase_by_class.map(r => html`
            <tr key=${r.class}><td>${r.class}</td><td className="n">${num(r.positions)}</td>
              <td className="mono dim">${r.method}</td><td className="n strong">${r.mase.toFixed(2)}</td>
              <td className="n dim">${r.naive.toFixed(2)}</td><td className="n dim">${r.zero.toFixed(2)}</td></tr>`)}</tbody>
        </table></div>
        <div className="aside">MASE — mean absolute scaled error. Lower is better; 1.00 means no better than
          repeating last year.
          ${zeroLosers.length > 0 ? html` <b>We lose to forecasting zero on ${" " + zeroLosers.join(" and ")} parts,
            and that is expected.</b> A part issued four times in three years is zero in most months, so always
            answering "none" scores well on the average month and is useless on the four that matter — it can
            never tell you to order anything. That is why the stock levels come from the demand distribution and
            not from the forecast.` : ""}</div>`}

      ${bt && html`
        <h2>The held-out year, replayed under both sets of levels</h2>
        <div className="card"><table>
          <thead><tr><th></th><th className="n">The plant's levels</th><th className="n">Ours</th><th className="n">Change</th></tr></thead>
          <tbody>
            ${row("Days waiting for a part", "stockout_days")}
            ${row("Units short over the year", "units_short")}
            ${row("Average value on the shelves", "avg_capital_sar", true)}
            ${row("Cost of being short", "shortage_cost_sar", true)}
            ${row("Cost of holding stock", "holding_cost_sar", true)}
            ${row("Cost of placing orders", "ordering_cost_sar", true)}
            ${row("Purchase orders placed", "orders_placed")}
            <tr className="total"><td>All three costs together</td><td className="n">${M(b.total_cost_sar)}</td>
              <td className="n">${M(p.total_cost_sar)}</td><td className="n acc">${signPct(ch.total_cost_sar)}</td></tr>
          </tbody>
        </table></div>
        <div className="aside"><b>Read this honestly: we spend more to waste less.</b> Our levels hold
          ${" " + signPct(ch.avg_capital_sar)} more stock, not less. In exchange the plant waits
          ${" " + signPct(ch.stockout_days).slice(1)} fewer days for a part, and the three costs together come out
          ${" " + signPct(ch.total_cost_sar)}. Better stocking here moves cash to where it stops production
          losses. Releasing cash is a different exercise — finding the stock that is dead — and that is the next
          step.</div>
        <div className="card" style=${{ marginTop: "16px" }}><table>
          <thead><tr><th>If the part is missing</th><th className="n">Records</th><th className="n">Days waiting now</th>
            <th className="n">With ours</th><th className="n">Value now</th><th className="n">With ours</th></tr></thead>
          <tbody>${(bt.by_criticality || []).map(r => html`
            <tr key=${r.criticality}>
              <td><span className=${"crit " + r.criticality}>${r.criticality}</span>
                ${" "}${{ A: "the plant stops", B: "production slows", C: "somebody waits" }[r.criticality] || ""}</td>
              <td className="n">${num(r.positions)}</td><td className="n dim">${num(r.baseline_stockout_days)}</td>
              <td className="n strong">${num(r.policy_stockout_days)}</td><td className="n dim">${M(r.baseline_capital_sar)}</td>
              <td className="n">${M(r.policy_capital_sar)}</td></tr>`)}</tbody>
        </table></div>`}

      ${fr && fr.curve && html`
        <h2>What a service level costs — the same year, priced ten ways</h2>
        <div className="chartbox"><${Frontier} fr=${fr} /></div>
        <div className="aside"><b>${(fr.at_the_plants_own_service_level || {}).plain || ""}</b>
          ${" "}Our own levels are deliberately not on the curve: every point on it uses one blanket service
          level for everything, while ours gives each part its own from how badly its absence hurts and what it
          costs to hold.</div>`}

      <footer className="run">Read-only view over precomputed results. Nothing on any page is calculated at
        request time. Run ${run.config_hash} · seed ${run.seed} · cut-off ${" " + run.cutoff_date} · generated
        ${" " + run.generated_at}.</footer>
    <//>`;
}

/* ── the drawer ───────────────────────────────────────────────────────────── */
function Drawer({ id, onClose }) {
  const [state, setState] = useState({ status: "loading" });
  useEffect(() => {
    setState({ status: "loading" });
    getJSON("/api/positions/" + id[0] + "/" + id[1])
      .then(d => setState({ status: "ready", d }))
      .catch(e => setState({ status: "error", detail: String(e.message || e) }));
  }, [id[0], id[1]]);
  useEffect(() => {
    const esc = e => { if (e.key === "Escape") { e.stopPropagation(); onClose(); } };
    window.addEventListener("keydown", esc, true);
    return () => window.removeEventListener("keydown", esc, true);
  }, [onClose]);
  const d = state.d;
  const body = () => {
    if (state.status === "loading") return html`<div className="body"><${Loading} /></div>`;
    if (state.status === "error") return html`<div className="body"><div className="state"><h3>Not found</h3><p>${state.detail}</p></div></div>`;
    const usage = d.usage_months || [], fc = d.forecast_months || [], planned = d.planned_wo_months || [];
    const monthly = d.qty_24m / 24;
    const sinceIssue = d.last_issue_date ? Math.round((Date.parse(d.today || d.last_issue_date) - Date.parse(d.last_issue_date)) / 86400000) : null;
    return html`
      <div className="body">
        <div className="stats">
          <div className="stat"><div className="k">On the shelf <${Info} text=${TIP.on_hand} /></div>
            <div className="v">${num1(d.on_hand)}</div><div className="u">${d.uom}</div></div>

            <div className="u">${d.last_issue_date ? "" : "in three years"}</div></div>
          <div className="stat"><div className="k">Expected use <${Info} text=${TIP.forecast6} /></div>

          <div className="stat"><div className="k">Value on shelf <${Info} text=${TIP.value_on_shelf} /></div>
            <div className="v">${M(d.value_sar)}</div><div className="u">at book value</div></div>
        </div>
        <h2>Three years of movement, with the forecast over the last one</h2>
        <${UsageChart} usage=${usage} forecast=${fc} planned=${planned} trainMonths=${d.train_months}
                       startMonth=${d.months_start} uom=${d.uom} />
        ${d.elsewhere && d.elsewhere.length > 0 && html`
          <h2>Also kept in other stores</h2>
          <div className="card"><table>
            <thead><tr><th>Store</th><th className="n">On the shelf</th><th className="n">Our level</th><th>State</th><th className="n">Value</th></tr></thead>
            <tbody>${d.elsewhere.map(e => html`
              <tr key=${e.storeroom_id}><td className="strong">${e.storeroom_id}</td><td className="n">${num1(e.on_hand)}</td>
                <td className="n">${num1(e.reorder_point)}</td><td><${Tag} kind="b" value=${e.band} /></td><td className="n">${M(e.value_sar)}</td></tr>`)}</tbody>
          </table></div>`}
        <h2>Why this number</h2>
        <div className="why">
          <p>This part was given out ${d.issues_24m === 0 ? "not once" : num(d.issues_24m) + (d.issues_24m === 1 ? " time" : " times")}
            ${" "}in the last 24 months${d.issues_24m > 0 ? html`, ${num1(d.qty_24m)} ${d.uom} in total — about ${" " + num1(monthly)} ${d.uom} a month` : ""}.

            ${" "}(roughly every ${num1(d.adi)} months; the technical name is ${" " + d.demand_class}), which is why it is
            planned with ${d.forecast_method}.
            ${d.planned_wo_qty > 0 ? html` On top of that, ${num1(d.planned_wo_qty)} ${" " + d.uom} was already on the
              maintenance schedule for the tested year — known, not predicted.` : ""}
            ${d.shutdown_qty_per_event > 0 ? html` Outages are kept out of the buffer: this part drew about
              ${" " + num1(d.shutdown_qty_per_event)} ${d.uom} per shutdown, and that is scheduled as its own demand
              ${d.next_shutdown_date ? " for the next one, starting " + dateShort(d.next_shutdown_date) : ""}${d.shutdown_due_qty > 0 ? " — it is inside this order" : ""}.` : ""}</p>
          <p>The plant's existing rule reorders at <b>${num1(d.min_qty)}</b> and fills to <b>${num1(d.max_qty)}</b>.
            We reorder at <b>${num1(d.reorder_point)}</b> and fill to <b>${num1(d.order_up_to)}</b>${" "}
            ${d.reorder_point > d.min_qty
              ? html`— higher, because being there ${pct(d.service_level)} of the time is the standard set for a part that
                     ${" " + { A: "stops the plant", B: "slows production", C: "makes somebody wait" }[d.criticality]}.`
              : html`— lower, because the old rule was holding more than this part's own history justifies.`}</p>
          <p><q>${d.reason}</q></p>
        </div>
      </div>`;
  };
  return html`
    <div>
      <div className="scrim" onClick=${onClose}></div>
      <aside className="drawer">
        <div className="dh">
          <button className="x" onClick=${onClose} aria-label="Close">×</button>
          <div className="do"><span>What to do</span>
            ${d && html`<${Action} value=${d.action} qty=${d.order_now_qty} uom=${d.uom} />`}
            ${d && d.cost_to_level_sar > 0 && html`<span className="cost">${M(d.cost_to_level_sar)} to bring it back to a safe level
              ${d.order_by_date ? " · order by " + dateShort(d.order_by_date) : ""}</span>`}</div>
          <div className="t">${d ? d.description : id[0]}</div>
          <div className="m">${id[0]} · ${id[1]}
            ${d ? html`<br/>${d.manufacturer} · part number ${d.mpn} · ${d.material_group}
              <br/><span className=${"crit " + d.criticality}>${{ A: "A — the plant stops without it",
                B: "B — production slows without it", C: "C — somebody waits" }[d.criticality] || d.criticality}</span>
              ${" · takes " + num(d.lead_time_days) + " days to arrive"}
              ${d.lead_time_substituted ? " (the record was not usable; this is the typical figure for this kind of part)" : ""}` : ""}</div>
        </div>
        ${body()}
      </aside>
    </div>`;
}

/* ── shell, routing, present mode ─────────────────────────────────────────── */
const SCREENS = [
  { key: "", name: "Dashboard" },
  { key: "storerooms", name: "Storerooms" },
  { key: "board", name: "Stock board" },
  { key: "recommendations", name: "Recommendations" },
  { key: "chat", name: "Ask" },
];
const STORES = ["SMELTER", "ROLLING", "CENTRAL", "REFINERY", "BAITHA"];

// #/present/board/M-1/SMELTER → present, board, drawer on M-1 in SMELTER
// #/storerooms/ROLLING        → one store's list
function parseHash() {
  let parts = (location.hash || "#/").slice(1).split("/").filter(Boolean);
  const present = parts[0] === "present";
  if (present) parts = parts.slice(1);
  let focus = "";
  if (parts[0] && parts[0].startsWith("@")) { focus = parts[0].slice(1); parts = parts.slice(1); }
  const known = SCREENS.some(s => s.key === parts[0]) || parts[0] === "evidence";
  const screen = known ? parts[0] : "";
  let open = null, store = "", ask = "";
  // #/chat/q/<question> opens the assistant with the question already asked
  if (screen === "chat" && parts[1] === "q" && parts.length >= 3) ask = decodeURIComponent(parts.slice(2).join("/"));
  else if (parts.length >= 3) open = [parts[1], parts[2]];
  else if (screen === "storerooms" && parts.length === 2) store = parts[1];
  return { present, screen: open && !screen ? "board" : screen, open, store, focus, ask };
}
function toHash({ present, screen, open, store, focus }) {
  const bits = [];
  if (present) bits.push("present");
  if (focus && !screen) bits.push("@" + focus);
  if (screen) bits.push(screen);
  if (open) { if (!screen) bits.push("board"); bits.push(open[0], open[1]); }
  else if (store) bits.push(store);
  return "#/" + bits.join("/");
}

function useTheme() {
  const [theme, setTheme] = useState(document.documentElement.getAttribute("data-theme") || "dark");
  const flip = () => {
    const next = theme === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) { /* private window */ }
    setTheme(next);
  };
  return [theme, flip];
}

function App() {
  const [route, setRoute] = useState(parseHash);
  const [state, setState] = useState({ status: "loading" });
  const [theme, flipTheme] = useTheme();
  useEffect(() => {
    const on = () => setRoute(parseHash());
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);
  useEffect(() => {
    Promise.all([
      getJSON("/api/summary"), getJSON("/api/scoreboard"),
      getJSON("/api/backtest").catch(() => null), getJSON("/api/forecast_scores").catch(() => null),
      getJSON("/api/storerooms").catch(() => null), getJSON("/api/frontier").catch(() => null),
      getJSON("/api/dead_money").catch(() => null),
    ]).then(([summary, score, bt, fc, stores, fr, dead]) =>
      setState({ status: "ready", summary, score, bt, fc, stores, fr, dead }))
      .catch(err => setState({ status: "error", detail: err.message || String(err) }));
  }, []);
  // ← → walk the four pages in order; Escape leaves present mode. An open drawer
  // takes Escape first, which is why it listens in the capture phase.
  useEffect(() => {
    if (!route.present) return;
    const idx = SCREENS.findIndex(s => s.key === route.screen);
    const key = e => {
      if (route.open) return;
      if (e.key === "ArrowRight" && idx >= 0 && idx < SCREENS.length - 1)
        location.hash = toHash({ present: true, screen: SCREENS[idx + 1].key });
      if (e.key === "ArrowLeft" && idx > 0)
        location.hash = toHash({ present: true, screen: SCREENS[idx - 1].key });
      if (e.key === "Escape") location.hash = toHash({ present: false, screen: route.screen });
    };
    window.addEventListener("keydown", key);
    return () => window.removeEventListener("keydown", key);
  }, [route.present, route.screen, route.open]);

  const setOpen = useCallback(id => {
    const r = parseHash();
    location.hash = toHash({ present: r.present, screen: r.screen || "board", open: id, store: r.store });
  }, []);
  const setStore = useCallback(store => {
    const r = parseHash();
    location.hash = toHash({ present: r.present, screen: "storerooms", store });
  }, []);
  const setFocus = useCallback(focus => {
    const r = parseHash();
    location.hash = toHash({ present: r.present, screen: "", focus });
  }, []);
  const go = screen => { location.hash = toHash({ present: route.present, screen }); };

  if (state.status === "loading") return html`<${Loading} />`;
  if (state.status === "error") return html`<${Failed} what="No results to show" detail=${state.detail} />`;

  const run = state.summary.run;
  const idx = SCREENS.findIndex(s => s.key === route.screen);
  const page =
    route.screen === "storerooms" ? html`<${Storerooms} stores=${state.stores} setOpen=${setOpen} store=${route.store} setStore=${setStore} />`
    : route.screen === "board" ? html`<${Board} setOpen=${setOpen} />`
    : route.screen === "recommendations" ? html`<${Recommendations} setOpen=${setOpen} />`
    : route.screen === "chat" ? html`<${Chat} setOpen=${setOpen} ask=${route.ask} />`
    : route.screen === "evidence" ? html`<${Evidence} summary=${state.summary} score=${state.score} bt=${state.bt} fc=${state.fc} fr=${state.fr} />`
    : html`<${Dashboard} summary=${state.summary} stores=${state.stores} bt=${state.bt} fr=${state.fr}
                          store=${route.focus} setStore=${setFocus} dead=${state.dead} />`;

  return html`
    <div className=${"shell" + (route.present ? " present" : "")}>
      <nav>
        <div className="brand">
          <div className="eyebrow">Ma'aden Aluminium</div>
          <div className="word"><i></i>Inventory Intelligence</div>
        </div>
        ${SCREENS.map((s, i) => html`
          <button key=${s.key} className=${"step" + (route.screen === s.key ? " on" : "")} onClick=${() => go(s.key)}>
            <span>${s.name}</span></button>`)}
        <button className="present-btn" onClick=${() => { location.hash = toHash({ present: true, screen: idx >= 0 ? route.screen : "" }); }}>
          <span>Present</span><kbd>← → · Esc</kbd></button>
        <button className="theme-btn" onClick=${flipTheme} title="Switch between dark and light">
          <span>${theme === "dark" ? "Light mode" : "Dark mode"}</span><kbd>${theme === "dark" ? "☾" : "☼"}</kbd></button>
        <div className="foot">run ${run.config_hash}<br/>seed ${run.seed}<br/>cut-off ${run.cutoff_date}</div>
      </nav>
      <main>
        ${page}
        ${route.screen !== "evidence" && html`
          <div className="page"><div className="evlink">
            <span>Every figure on these pages is read from results written when the analysis ran.</span>
            <button onClick=${() => go("evidence")}>Evidence — how well it works, for engineers →</button>
          </div></div>`}
      </main>
      ${route.present && html`
        <div className="present-hud">
          <button onClick=${() => idx > 0 && go(SCREENS[idx - 1].key)} aria-label="Previous">←</button>
          <span><span className="n">${idx >= 0 ? idx + 1 : "·"}</span> / ${SCREENS.length}</span>
          <button onClick=${() => idx >= 0 && idx < SCREENS.length - 1 && go(SCREENS[idx + 1].key)} aria-label="Next">→</button>
          <button onClick=${flipTheme} title="Switch between dark and light">${theme === "dark" ? "☼" : "☾"}</button>
          <button onClick=${() => { location.hash = toHash({ present: false, screen: route.screen }); }} title="Exit (Esc)">Esc</button>
        </div>`}
      ${route.open && html`<${Drawer} id=${route.open} onClose=${() => setOpen(null)} />`}
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
