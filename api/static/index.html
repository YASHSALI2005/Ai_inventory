<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma'aden MRO Intelligence</title>

<!--
  React, ReactDOM and htm are vendored into static/vendor rather than pulled from a
  CDN. A dashboard that renders a blank page in a meeting room is worse than no
  dashboard, and a demo laptop on a plant site may have no route to the internet at
  all. Same files, pinned versions, no network.

  Both charts are inline SVG for the same reason, and because a chart library would
  be a new dependency for some rectangles, a polyline and a dashed line.
-->
<script src="/static/vendor/react.production.min.js"></script>
<script src="/static/vendor/react-dom.production.min.js"></script>
<script src="/static/vendor/htm.umd.js"></script>

<style>
:root{
  --ground:#F4F2EF; --surface:#FFFFFF; --panel:#F5F3F0; --panel-2:#EDEAE5;
  --ink:#1A1D21; --ink-2:#3C4148; --muted:#71767E;
  --line:#DAD6D0; --line-2:#C3BDB5;
  --accent:#A24E28; --accent-soft:#F3E4DB;
  --teal:#2B6B67; --teal-soft:#DFEBEA;
  --warn:#8A6212; --warn-soft:#F5EBD4;
  --red:#9C2F26; --red-soft:#F6E1DE;
  --blue:#2C5A82; --blue-soft:#DFE9F2;
  --violet:#5B4B8A; --violet-soft:#E7E3F2;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#15171A; --surface:#1D2024; --panel:#212529; --panel-2:#282D32;
    --ink:#E9E6E1; --ink-2:#C6C2BC; --muted:#949AA2;
    --line:#31353B; --line-2:#434952;
    --accent:#D9825A; --accent-soft:#3A2A22;
    --teal:#5FAAA4; --teal-soft:#1E2E2D;
    --warn:#D0A445; --warn-soft:#312813;
    --red:#E08076; --red-soft:#3A211E;
    --blue:#7FAAD2; --blue-soft:#1C2733;
    --violet:#A297D4; --violet-soft:#25213A;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono,.num,td.n,th.n{font-family:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}

/* ── shell ────────────────────────────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:22px 0;
  display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh}
nav .brand{padding:0 20px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
nav .brand .mark{font-family:Consolas,monospace;font-size:10.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--accent)}
nav .brand .name{font-size:16px;font-weight:700;letter-spacing:-.01em;margin-top:5px}
nav .brand .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
nav button.link{display:block;width:100%;text-align:left;padding:9px 20px;font-size:14px;
  color:var(--ink-2);border-left:3px solid transparent}
nav button.link:hover{background:var(--panel-2)}
nav button.link.on{background:var(--accent-soft);color:var(--accent);font-weight:600;
  border-left-color:var(--accent)}
nav .foot{margin-top:auto;padding:16px 20px 0;border-top:1px solid var(--line);
  font-family:Consolas,monospace;font-size:10.5px;color:var(--muted);line-height:1.8}
main{padding:30px 30px 70px;max-width:1280px;overflow-x:hidden}

header{border-bottom:2px solid var(--ink);padding-bottom:15px;margin-bottom:22px}
h1{font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
header .lede{font-size:13.5px;color:var(--muted);margin-top:8px;max-width:76ch}
header .lede b{color:var(--ink-2)}
h2{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin:30px 0 11px;display:flex;align-items:center;gap:6px}

/* ── the little i ─────────────────────────────────────────────────────────── */
.info{display:inline-flex;align-items:center;justify-content:center;width:14px;
  height:14px;border-radius:50%;border:1px solid var(--line-2);color:var(--muted);
  font-family:Georgia,serif;font-style:italic;font-size:10px;line-height:1;
  cursor:help;vertical-align:middle;flex:0 0 auto;text-transform:none;
  letter-spacing:0;font-weight:400}
.info:hover,.info:focus{border-color:var(--accent);color:var(--accent);outline:none}

/* ── tiles ────────────────────────────────────────────────────────────────── */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.tiles.three{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:3px;
  padding:18px 20px}
.tile .v{font-family:Consolas,monospace;font-size:32px;font-weight:600;
  letter-spacing:-.025em;line-height:1.05}
.tile .k{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.4;
  display:flex;align-items:center;gap:5px}
.tile .band{font-family:Consolas,monospace;font-size:11px;margin-top:10px;
  padding-top:9px;border-top:1px solid var(--line);display:flex;
  justify-content:space-between;gap:10px}
.tile-note{font-size:12.5px;line-height:1.55;color:var(--ink-2);margin-top:12px;
  padding-top:11px;border-top:1px solid var(--line)}
.tile.hero{background:var(--accent-soft);border-color:var(--accent)}
.tile.hero .v{color:var(--accent)}
.tile.good .v{color:var(--teal)} .tile.bad .v{color:var(--red)}
.in-band{color:var(--teal)} .out-band{color:var(--warn)}

.headline{background:var(--surface);border:1px solid var(--line-2);border-left:3px solid var(--accent);
  border-radius:3px;padding:13px 16px;margin-bottom:14px;font-size:14.5px}
.headline b{font-size:16px}

/* ── tables ───────────────────────────────────────────────────────────────── */
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:3px;
  background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);text-align:left;padding:9px 10px;background:var(--panel-2);
  border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
th.n,td.n{text-align:right}
th.n .info{margin-left:3px}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
  vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tr.total td{background:var(--panel);font-weight:600;border-top:1px solid var(--line-2)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel)}
.good{color:var(--teal);font-weight:600}
.bad{color:var(--red);font-weight:600}
.dim{color:var(--muted)}
td.n .u{font-size:11px}
td .sub{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:normal}
td.item{white-space:normal;max-width:215px;min-width:165px}
td.item .d{line-height:1.35}
.mixchip{display:inline-block;margin-right:7px;white-space:nowrap}

/* ── chips, pills, actions ────────────────────────────────────────────────── */
.chiprow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:0 0 9px}
.chiplab{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);width:104px;flex:0 0 auto;display:flex;align-items:center;gap:5px}
.chip{border:1px solid var(--line-2);border-radius:14px;padding:5px 13px;
  font-size:12.5px;background:var(--surface);color:var(--ink-2);white-space:nowrap}
.chip:hover{border-color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--ground);border-color:var(--ink);font-weight:600}
.chip .c{font-family:Consolas,monospace;font-size:11px;opacity:.7;margin-left:6px}
.pill{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:2px;
  white-space:nowrap}
.b-stocked_out{background:var(--red-soft);color:var(--red)}
.b-below_reorder{background:var(--accent-soft);color:var(--accent)}
.b-below_old_min{background:var(--warn-soft);color:var(--warn)}
.b-never_issued{background:var(--panel-2);color:var(--muted)}
.b-idle_24m{background:var(--blue-soft);color:var(--blue)}
.b-well_stocked{background:var(--teal-soft);color:var(--teal)}
.c-smooth{background:var(--teal-soft);color:var(--teal)}
.c-erratic{background:var(--warn-soft);color:var(--warn)}
.c-intermittent{background:var(--blue-soft);color:var(--blue)}
.c-lumpy{background:var(--violet-soft);color:var(--violet)}
.act{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;
  border-radius:2px;white-space:nowrap;border-left:3px solid}
.a-order{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.a-move{background:var(--teal-soft);color:var(--teal);border-color:var(--teal)}
.a-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.a-review{background:var(--blue-soft);color:var(--blue);border-color:var(--blue)}
.a-ok{background:transparent;color:var(--muted);border-color:var(--line-2);font-weight:400}
.crit{font-family:Consolas,monospace;font-weight:600}
.crit-A{color:var(--red)} .crit-B{color:var(--warn)} .crit-C{color:var(--muted)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
select,input[type=search]{font:inherit;font-size:13.5px;padding:6px 10px;
  border:1px solid var(--line-2);border-radius:3px;background:var(--surface);
  color:var(--ink)}
input[type=search]{min-width:270px}
.pager{display:flex;gap:10px;align-items:center;justify-content:space-between;
  margin-top:12px;font-size:13px;color:var(--muted)}
.pager button{border:1px solid var(--line-2);border-radius:3px;padding:5px 12px;
  background:var(--surface);font-size:13px}
.pager button[disabled]{opacity:.4;cursor:default}

.note{border:1px dashed var(--line-2);border-radius:3px;padding:12px 15px;
  margin-top:11px;font-size:13px;color:var(--ink-2);line-height:1.6}
.note b{color:var(--ink)}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note code,footer code{font-family:Consolas,monospace;font-size:12px;
  background:var(--panel-2);padding:1px 5px;border-radius:2px}

/* ── drawer ───────────────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(20,20,22,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(690px,96vw);z-index:41;
  background:var(--surface);border-left:1px solid var(--line-2);overflow-y:auto;
  box-shadow:-18px 0 44px rgba(0,0,0,.16)}
.drawer .dh{padding:20px 24px 16px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--surface);z-index:2}
.drawer .dh .t{font-size:18px;font-weight:700;line-height:1.25;padding-right:34px}
.drawer .dh .m{font-family:Consolas,monospace;font-size:11.5px;color:var(--muted);
  margin-top:7px;line-height:1.7}
.drawer .x{position:absolute;top:17px;right:18px;font-size:22px;line-height:1;
  color:var(--muted);padding:2px 7px}
.drawer .body{padding:18px 24px 60px}
.drawer h2{margin-top:22px}
.do-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border:1px solid var(--line-2);border-radius:3px;padding:11px 14px;
  background:var(--panel);margin-bottom:16px;font-size:13px}
.do-lab{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
  margin-bottom:18px}
.stat{border:1px solid var(--line);border-radius:3px;padding:11px 13px;
  background:var(--panel)}
.stat .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:4px}
.stat .v{font-family:Consolas,monospace;font-size:19px;font-weight:600;margin-top:5px;
  letter-spacing:-.01em}
.stat .u{font-size:11px;color:var(--muted);margin-top:2px}
.why{border:1px solid var(--accent);background:var(--accent-soft);border-radius:3px;
  padding:15px 17px;margin:0 0 6px;font-size:13.5px;line-height:1.65;color:var(--ink)}
.why .lab{font-family:Consolas,monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.why p+p{margin-top:9px}
.why q{quotes:'"' '"'}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--muted);
  margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:1px}
.chartbox{border:1px solid var(--line);border-radius:3px;background:var(--surface);
  padding:12px 12px 8px;overflow-x:auto}

.err{background:var(--warn-soft);border:1px solid var(--warn);border-radius:3px;
  padding:18px 20px;color:var(--ink)}
.err h3{font-size:15px;margin-bottom:8px}
.err code{font-family:Consolas,monospace;font-size:13px;display:block;margin-top:10px;
  background:var(--surface);padding:9px 12px;border-radius:2px;border:1px solid var(--line)}
footer{margin-top:36px;padding-top:15px;border-top:1px solid var(--line);
  font-size:12px;color:var(--muted);line-height:1.6}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;
    padding:12px 16px;gap:8px}
  nav .brand{border:none;padding:0 14px 0 0;margin:0}
  nav .foot{display:none}
  main{padding:20px 16px 60px}
  .chiplab{width:100%}
}
</style>
</head>
<body>
<div id="root"></div>

<script>
// A blank screen in a meeting room is the worst outcome this page can produce, so
// any failure — a script that did not load, a bug in here — is shown instead of
// swallowed.
function fatal(what, err) {
  const root = document.getElementById("root");
  if (root) {
    root.innerHTML =
      '<div style="padding:30px"><div class="err"><h3>' + what + "</h3><code>" +
      String((err && (err.stack || err.message)) || err) + "</code></div></div>";
  }
}
window.addEventListener("error", e => fatal("Page failed to render", e.error || e.message));

for (const [name, obj] of [["React", window.React], ["ReactDOM", window.ReactDOM],
                           ["htm", window.htm]]) {
  if (!obj) fatal("Could not load " + name, name + " is not on the page — no network?");
}

const html = htm.bind(React.createElement);
const { useState, useEffect, useCallback } = React;

/* ── numbers ──────────────────────────────────────────────────────────────────
   Money is shown in millions with one decimal, everywhere, on every page. A
   figure like "SAR 1,412,694,541" is not read, it is skipped; "SAR 1,412.7m" is
   read. The only exception is a quantity of parts, which is a count of things.  */
const M = n => {
  if (n === null || n === undefined || Number.isNaN(n)) return "—";
  if (n === 0) return "SAR 0";
  const v = n / 1e6;
  if (Math.abs(v) >= 1000) return "SAR " + (v / 1000).toFixed(2) + "bn";
  return "SAR " + v.toFixed(1) + "m";
};
const num = n => (n === null || n === undefined ? "—" : Math.round(n).toLocaleString("en-US"));
const num1 = n => (n === null || n === undefined ? "—"
  : (Math.round(n * 10) / 10).toLocaleString("en-US"));
const pct = n => (n === null || n === undefined ? "—" : (n * 100).toFixed(1) + "%");
const pctInt = n => (n === null || n === undefined ? "—" : Math.round(n * 100) + "%");
const signPct = n => (n === null || n === undefined ? "—"
  : (n >= 0 ? "+" : "") + Math.round(n * 100) + "%");

const getJSON = url => fetch(url).then(r =>
  r.ok ? r.json() : r.json().then(e => Promise.reject(new Error(e.detail || r.status))));

/* ── the words ────────────────────────────────────────────────────────────────
   Everything a person reads on pages 1-3 is in plain English. The technical name
   lives in the tooltip, so an engineer can still find it and a planner never has
   to learn it to use the screen. Page 4 is the exception and says so.           */
const BAND_LABEL = {
  stocked_out: "None left",
  below_reorder: "Below our level",
  below_old_min: "Below the old minimum",
  never_issued: "Never used here",
  idle_24m: "Not used in 2 years",
  well_stocked: "Enough on the shelf",
};
const BAND_ORDER = ["stocked_out", "below_reorder", "below_old_min", "idle_24m",
                    "never_issued", "well_stocked"];

const ACTION = {
  order_now: { label: "Order now", cls: "a-order" },
  stocked_elsewhere: { label: "Stocked elsewhere", cls: "a-move" },
  below_safe_level: { label: "Below safe level", cls: "a-warn" },
  review_obsolete: { label: "Review — obsolete?", cls: "a-review" },
  nothing_needed: { label: "Nothing needed", cls: "a-ok" },
};
const ACTION_ORDER = ["order_now", "stocked_elsewhere", "below_safe_level",
                      "review_obsolete", "nothing_needed"];

const CLASS_LABEL = {
  smooth: "Used regularly",
  erratic: "Regular, varying amounts",
  intermittent: "Now and then",
  lumpy: "Rarely, in bursts",
};
const CLASS_TIP = {
  smooth: "Technical name: smooth. Moves most months, in similar amounts.",
  erratic: "Technical name: erratic. Moves most months, but the amount jumps about.",
  intermittent: "Technical name: intermittent. Long gaps between uses, similar amounts each time.",
  lumpy: "Technical name: lumpy. Long gaps between uses, and the amount jumps about — the hardest kind to plan.",
};
const CLASS_ORDER = ["smooth", "erratic", "intermittent", "lumpy"];
// The mix column would run off the side of the page if it named all four groups for
// five stores. Two biggest, then a count — the shape is what the column is for.
const topMix = mix => Object.entries(mix).sort((a, b) => b[1] - a[1]).slice(0, 2)
  .map(e => e[0]);
const restMix = mix => Object.entries(mix).sort((a, b) => b[1] - a[1]).slice(2)
  .reduce((t, e) => t + e[1], 0);

const TIP = {
  reorder: "Reorder point — when the shelf falls to this number, order more.",
  order_up_to: "Order up to — the number we bring it back to when we order.",
  on_hand: "How many are on the shelf in this storeroom right now.",
  old_min: "The plant's existing minimum and maximum, set by hand years ago.",
  dead: "Stock the plant is very unlikely to use: either the machine it belongs to is gone, or there is more of it than three years of use would justify. Valued at what the books say it is worth.",
  idle: "Parts that have not been issued to any job in the last two years.",
  critical_low: "Parts whose absence stops production, sitting below the level we say is safe.",
  cost_to_level: "What it would cost to buy these back up to their safe level.",
  value_on_shelf: "What is on the shelf, valued at the price the books carry it at.",
  forecast6: "How many we expect to be used in the next six months.",
  last_issued: "The last time this part was given out to a job.",
  crit: "How badly it hurts if this part is missing. A stops production, B slows it, C means somebody waits.",
  class: "How this part moves: steadily, or in occasional bursts. It decides how it is planned.",
  what_to_do: "The one thing to do about this part today.",
  waiting: "Days a storeroom record spent with nothing on the shelf while a job wanted it, added up across the year.",
  capital: "Average value sitting on the shelves through the year.",
  total_cost: "Being short, holding stock, and placing orders, added together.",
  storeroom: "One of the five stores: the mine, the refinery, the smelter, the rolling mill, and the central warehouse.",
  moved: "The same part sitting spare in one store while another store is below its safe level.",
};

function Info({ text }) {
  return html`<span className="info" title=${text} tabIndex="0" role="img"
    aria-label=${text}>i</span>`;
}

function Pill({ kind, value, tip }) {
  if (!value) return null;
  const label = kind === "b" ? (BAND_LABEL[value] || value)
    : kind === "c" ? (CLASS_LABEL[value] || value) : value;
  return html`<span className=${"pill " + kind + "-" + value} title=${tip || ""}>${label}</span>`;
}

function Action({ value, qty, uom }) {
  const a = ACTION[value] || ACTION.nothing_needed;
  const label = value === "order_now" && qty > 0
    ? "Order " + num1(qty) + " " + (uom || "") : a.label;
  return html`<span className=${"act " + a.cls}>${label}</span>`;
}

function Tile({ label, value, tip, hero, tone, band, actual, foot, note }) {
  const inBand = band ? actual >= band[0] && actual <= band[1] : null;
  return html`
    <div className=${"tile" + (hero ? " hero" : "") + (tone ? " " + tone : "")}>
      <div className="v">${value}</div>
      <div className="k">${label}${tip && html` <${Info} text=${tip} />`}</div>
      ${band && html`
        <div className="band">
          <span className=${inBand ? "in-band" : "out-band"}>${inBand ? "in band" : "OUT OF BAND"}</span>
          <span className="dim">target ${pctInt(band[0])}–${pctInt(band[1])}</span>
        </div>`}
      ${foot && html`<div className="band"><span className="dim">${foot}</span></div>`}
      ${note && html`<p className="tile-note">${note}</p>`}
    </div>`;
}

function Page({ title, lede, children }) {
  return html`
    <div>
      <header>
        <h1>${title}</h1>
        <div className="lede"><b>How to read this page:</b> ${lede}</div>
      </header>
      ${children}
    </div>`;
}

/* ── page 1: Today ────────────────────────────────────────────────────────── */
function Today({ summary, stores }) {
  const inv = summary.inventory, c = summary.counts;
  return html`
    <${Page} title="Today"
             lede=${"three numbers, and what to do about each. Everything else on "
                    + "this system is detail underneath them."}>
      <div className="tiles three">

/* ── page 4: how well it works ────────────────────────────────────────────── */
function Scoreboard({ data }) {
  const rows = data.by_type || [];
  const s = data.summary || {};
  const rate = v => (v === null || v === undefined || Number.isNaN(v) ? "—" : pctInt(v));
  const recall = r => (r.planted ? r.found / r.planted : null);
  const prec = r => (r.found + r.false_alarms ? r.found / (r.found + r.false_alarms) : null);
  return html`
    <div className="scroller">
      <table>
        <thead><tr>
          <th>Defect type</th><th className="n">Planted</th><th className="n">Found</th>
          <th className="n">Missed</th><th className="n">False alarms</th>
          <th className="n">Recall</th><th className="n">Precision</th>
        </tr></thead>
        <tbody>
          ${rows.map(r => html`
            <tr key=${r.defect_type}>
              <td>${r.defect_type}</td>
              <td className="n">${r.planted}</td><td className="n">${r.found}</td>
              <td className=${"n " + (r.missed ? "bad" : "")}>${r.missed}</td>
              <td className=${"n " + (r.false_alarms ? "bad" : "")}>${r.false_alarms}</td>
              <td className=${"n " + (recall(r) === 1 ? "good" : "")}>${rate(recall(r))}</td>
              <td className=${"n " + (prec(r) === 1 ? "good" : "")}>${rate(prec(r))}</td>
            </tr>`)}
          <tr className="total">
            <td>Total — checks that ran</td>
            <td className="n">${s.planted}</td><td className="n">${s.found}</td>
            <td className=${"n " + (s.missed ? "bad" : "")}>${s.missed}</td>
            <td className=${"n " + (s.false_alarms ? "bad" : "")}>${s.false_alarms}</td>
            <td className=${"n " + (s.recall === 1 ? "good" : "")}>${rate(s.recall)}</td>
            <td className=${"n " + (s.precision === 1 ? "good" : "")}>${rate(s.precision)}</td>
          </tr>
        </tbody>
      </table>
    </div>`;
}

/* The frontier. Two axes that pull against each other, and the plant's own policy
   as a point off the end of the curve — which is the finding, not a gap.        */
function Frontier({ fr }) {
  if (!fr || !fr.curve) return null;
  const W = 640, H = 280, L = 62, R = 96, T = 16, B = 46;
  const iw = W - L - R, ih = H - T - B;
  const pts = fr.curve.map(r => ({ x: r.stockout_days, y: r.avg_capital_sar,
                                   s: r.service_level }));
  const extra = [
    { x: fr.baseline.stockout_days, y: fr.baseline.avg_capital_sar, tag: "the plant today" },
    { x: fr.recommended.stockout_days, y: fr.recommended.avg_capital_sar, tag: "ours" },
  ];
  const xs = pts.concat(extra).map(p => p.x), ys = pts.concat(extra).map(p => p.y);
  const x0 = 0, x1 = Math.max(...xs) * 1.05;
  const y0 = Math.min(...ys) * 0.9, y1 = Math.max(...ys) * 1.05;
  const X = v => L + ((v - x0) / (x1 - x0)) * iw;
  const Y = v => T + ih - ((v - y0) / (y1 - y0)) * ih;
  const path = pts.map((p, i) => (i ? "L" : "M") + X(p.x) + " " + Y(p.y)).join(" ");

  return html`
    <div className="chartbox">
      <svg viewBox=${"0 0 " + W + " " + H} width="100%"
           style=${{ minWidth: "560px", display: "block" }}
           role="img" aria-label="capital against days waiting">
        ${[0, 0.5, 1].map(f => html`
          <g key=${"g" + f}>
            <line x1=${L} x2=${W - R} y1=${Y(y0 + (y1 - y0) * f)} y2=${Y(y0 + (y1 - y0) * f)}
                  stroke="var(--line)" />
            <text x=${L - 7} y=${Y(y0 + (y1 - y0) * f) + 3.5} textAnchor="end"
                  fill="var(--muted)" fontSize="9.5" fontFamily="Consolas,monospace">
              ${M(y0 + (y1 - y0) * f)}</text>
          </g>`)}
        <path d=${path} fill="none" stroke="var(--accent)" strokeWidth="2" />
        ${pts.map((p, i) => html`
          <g key=${"p" + i}>
            <circle cx=${X(p.x)} cy=${Y(p.y)} r="3.5" fill="var(--accent)" />
            ${(i === 0 || i === pts.length - 1) && html`
              <text x=${X(p.x) + 8} y=${Y(p.y) + 3} fill="var(--accent)" fontSize="9.5"
                    fontFamily="Consolas,monospace">${pctInt(p.s)}</text>`}
          </g>`)}
        ${extra.map((p, i) => html`
          <g key=${"e" + i}>
            <circle cx=${X(p.x)} cy=${Y(p.y)} r="5.5"
                    fill=${i ? "var(--teal)" : "var(--red)"} />
            <text x=${X(p.x) + 9} y=${Y(p.y) + 3.5}
                  fill=${i ? "var(--teal)" : "var(--red)"} fontSize="10.5">${p.tag}</text>
          </g>`)}
        <line x1=${L} x2=${W - R} y1=${T + ih} y2=${T + ih} stroke="var(--line-2)" />
        ${[0, 0.5, 1].map(f => html`
          <text key=${"x" + f} x=${X(x0 + (x1 - x0) * f)} y=${H - 22} textAnchor="middle"
                fill="var(--muted)" fontSize="9.5" fontFamily="Consolas,monospace">
            ${num(x0 + (x1 - x0) * f)}</text>`)}
        <text x=${L + iw / 2} y=${H - 6} textAnchor="middle" fill="var(--muted)"
              fontSize="10.5">days a part was wanted and not there (whole year, all records)</text>
        <text x=${14} y=${T + ih / 2} fill="var(--muted)" fontSize="10.5"
              transform=${"rotate(-90 14 " + (T + ih / 2) + ")"} textAnchor="middle">
          average value on the shelves</text>
      </svg>
    </div>`;
}

function Evidence({ summary, score, bt, fc, fr }) {
  const b = (bt && bt.baseline) || {}, p = (bt && bt.policy) || {},
        ch = (bt && bt.change) || {};
  const zeroLosers = ((fc && fc.mase_by_class) || [])

  const row = (label, key, money) => html`

  return html`
    <${Page} title="How well it works"
             lede=${"the evidence page, written for engineers. This is the only page "

                    + "tooltips. Every figure here is graded against something: a "

      ${fc && html`
        <h2>Forecast accuracy on the held-out year</h2>

          <table>
            <thead><tr><th>Demand class</th><th className="n">Records</th>
              <th>Method</th><th className="n">MASE, ours</th>

            <tbody>${fc.mase_by_class.map(r => html`
              <tr key=${r.class}>
                <td>${r.class}</td>
                <td className="n">${num(r.positions)}</td>
                <td className="mono">${r.method}</td>
                <td className=${"n " + (r.mase < r.naive && r.mase < r.zero ? "good" : "")}>

                <td className="n dim">${r.naive.toFixed(2)}</td>
                <td className=${"n " + (r.zero < r.mase ? "bad" : "dim")}>${r.zero.toFixed(2)}</td>
              </tr>`)}</tbody>
          </table>
        </div>
        <div className="note">
          MASE — mean absolute scaled error. Lower is better; 1.00 means no better than

          ${zeroLosers.length > 0 ? html` <b>We lose to forecasting zero on
            ${" " + zeroLosers.join(" and ")} parts, and that is expected.</b> A part issued
            four times in three years is zero in most months, so always answering
            "none" scores well on the average month and is useless on the four that

        </div>`}

      ${bt && html`
        <h2>The held-out year, replayed under both sets of levels</h2>
        <div className="scroller">
          <table>
            <thead><tr><th></th><th className="n">The plant's levels</th>

            <tbody>

        </div>`}

      ${fr && fr.curve && html`
        <h2>What a service level costs — the same year, priced ten ways</h2>
        <${Frontier} fr=${fr} />
        <div className="note warn">
          <b>${(fr.at_the_plants_own_service_level || {}).plain || ""}</b>
          ${" "}Our own levels are the green point, and they are deliberately not on
          the curve: every point on the curve uses one blanket service level for
          everything, while ours gives each part its own from what its absence costs
          against what holding it costs.
        </div>`}

      <footer>
        Read-only view over precomputed results. Nothing on any page is calculated at
        request time — every figure was written to <code>results/</code> during
        ${" "}<code>build</code>, <code>run</code> and <code>score</code>.
        <br/>Run ${run.config_hash} · seed ${run.seed} · git ${run.git_sha} ·
        cut-off ${run.cutoff_date} · generated ${run.generated_at}.
      </footer>
    <//>`;
}
/* ── the usage chart ─────────────────────────────────────────────────────────
   Three series over the same months: what was actually issued, what we forecast,
   and the part of the forecast that is not a forecast at all — demand already on
   the maintenance schedule. The cut-off line matters more than it looks: it is
   the line the engine was not allowed to see past.                             */
function UsageChart({ usage, forecast, planned, trainMonths, startMonth, uom }) {
  const W = 620, H = 190, L = 46, R = 12, T = 12, B = 30;
  const n = usage.length, fN = forecast.length;
  const total = n + fN;
  const iw = W - L - R, ih = H - T - B;
  const step = iw / Math.max(total, 1);
  const peak = Math.max(1, ...usage, ...forecast.map((f, i) => f + (planned[i] || 0)));
  const y = v => T + ih - (v / peak) * ih;
  const bw = Math.max(1.5, step * 0.62);

  const [ys, ms] = startMonth.split("-").map(Number);
  const label = i => {
    const d = new Date(Date.UTC(ys, ms - 1 + i, 1));
    return ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct",
            "Nov", "Dec"][d.getUTCMonth()] + " " + String(d.getUTCFullYear()).slice(2);
  };
  const ticks = [];
  for (let i = 0; i < total; i += 6) ticks.push(i);
  const cutX = L + trainMonths * step;

  return html`
    <div className="chartbox">
      <svg viewBox=${"0 0 " + W + " " + H} width="100%"
           style=${{ minWidth: "560px", display: "block" }}
           role="img" aria-label="monthly usage and forecast">
        ${[0, 0.5, 1].map(f => html`
          <g key=${f}>
            <line x1=${L} x2=${W - R} y1=${y(peak * f)} y2=${y(peak * f)}
                  stroke="var(--line)" strokeWidth="1" />
            <text x=${L - 7} y=${y(peak * f) + 3.5} textAnchor="end"
                  fill="var(--muted)" fontSize="9.5"
                  fontFamily="Consolas,monospace">${num1(peak * f)}</text>
          </g>`)}

        ${usage.map((v, i) => v > 0 && html`
          <rect key=${"u" + i} x=${L + i * step + (step - bw) / 2} y=${y(v)}
                width=${bw} height=${Math.max(1, T + ih - y(v))} fill="var(--ink-2)" />`)}

        ${forecast.map((v, i) => html`
          <g key=${"f" + i}>
            <rect x=${L + (n + i) * step + (step - bw) / 2} y=${y(v)}
                  width=${bw} height=${Math.max(0.5, T + ih - y(v))}
                  fill="var(--accent)" opacity="0.85" />
            ${planned[i] > 0 && html`
              <rect x=${L + (n + i) * step + (step - bw) / 2} y=${y(v + planned[i])}
                    width=${bw} height=${Math.max(1, y(v) - y(v + planned[i]))}
                    fill="var(--teal)" />`}
          </g>`)}

        <line x1=${cutX} x2=${cutX} y1=${T} y2=${T + ih} stroke="var(--accent)"
              strokeWidth="1.2" strokeDasharray="4 3" />
        <text x=${cutX + 4} y=${T + 10} fill="var(--accent)" fontSize="9.5"
              fontFamily="Consolas,monospace">learnt up to here</text>

        <line x1=${L} x2=${W - R} y1=${T + ih} y2=${T + ih} stroke="var(--line-2)" />
        ${ticks.map(i => html`
          <text key=${"t" + i} x=${L + i * step + step / 2} y=${H - 15} textAnchor="middle"
                fill="var(--muted)" fontSize="9.5"
                fontFamily="Consolas,monospace">${label(i)}</text>`)}
        <text x=${L} y=${H - 3} fill="var(--muted)" fontSize="9.5"
              fontFamily="Consolas,monospace">${uom} per month</text>
      </svg>
      <div className="legend">
        <span><i style=${{ background: "var(--ink-2)" }}></i>given out</span>
        <span><i style=${{ background: "var(--accent)" }}></i>expected</span>
        <span><i style=${{ background: "var(--teal)" }}></i>already on the maintenance schedule</span>
      </div>
    </div>`;
}

/* ── the drawer ───────────────────────────────────────────────────────────── */
function Drawer({ id, onClose }) {
  const [state, setState] = useState({ status: "loading" });

  useEffect(() => {
    setState({ status: "loading" });
    getJSON("/api/positions/" + id[0] + "/" + id[1])
      .then(d => setState({ status: "ready", d }))
      .catch(e => setState({ status: "error", detail: String(e.message || e) }));
  }, [id[0], id[1]]);

  useEffect(() => {
    const esc = e => e.key === "Escape" && onClose();
    window.addEventListener("keydown", esc);
    return () => window.removeEventListener("keydown", esc);
  }, [onClose]);

  const inner = () => {
    if (state.status === "loading") return html`<div className="body">Loading…</div>`;
    if (state.status === "error")
      return html`<div className="body"><div className="err"><h3>Not found</h3>
        <div>${state.detail}</div></div></div>`;

    const d = state.d;
    const usage = d.usage_months || [];
    const fc = d.forecast_months || [];
    const planned = d.planned_wo_months || [];
    const monthly = d.qty_24m / 24;
    const sinceIssue = d.last_issue_date
      ? Math.round((Date.now() - Date.parse(d.last_issue_date)) / 86400000) : null;

    return html`
      <div className="body">
        <div className="do-line">
          <span className="do-lab">What to do</span>
          <${Action} value=${d.action} qty=${d.order_now_qty} uom=${d.uom} />
          ${d.cost_to_level_sar > 0 && html`
            <span className="dim">${" · " + M(d.cost_to_level_sar)} to bring it back
              to a safe level</span>`}
        </div>

        <div className="stats">
          <div className="stat"><div className="k">On the shelf <${Info} text=${TIP.on_hand} /></div>
            <div className=${"v " + (d.on_hand <= 0 ? "bad" : "")}>${num1(d.on_hand)}</div>
            <div className="u">${d.uom}</div></div>
          <div className="stat"><div className="k">Last used <${Info} text=${TIP.last_issued} /></div>
            <div className="v">${sinceIssue === null ? "never" : num(sinceIssue)}</div>
            <div className="u">${sinceIssue === null ? "in three years of history" : "days ago"}</div></div>
          <div className="stat"><div className="k">Expected use <${Info} text=${TIP.forecast6} /></div>
            <div className="v">${num1(d.forecast_6m / 6)}</div>
            <div className="u">${d.uom} a month, next 6</div></div>
          <div className="stat"><div className="k">Value on the shelf <${Info} text=${TIP.value_on_shelf} /></div>
            <div className="v">${M(d.value_sar)}</div>
            <div className="u">at book value</div></div>
        </div>

        <div className="why">
          <div className="lab">Why this number</div>
          <p>
            This part was given out ${d.issues_24m === 0 ? "not once" : num(d.issues_24m) +
            (d.issues_24m === 1 ? " time" : " times")} in the last 24 months
            ${d.issues_24m > 0 ? html`, ${num1(d.qty_24m)} ${d.uom} in total —
              about ${num1(monthly)} ${d.uom} a month` : ""}.
            So it moves <b>${(CLASS_LABEL[d.demand_class] || d.demand_class).toLowerCase()}</b>
            ${" "}(roughly every ${num1(d.adi)} months, and the amount varies by
            ${" " + num1(d.cv2)} — the technical name is ${d.demand_class}), which is
            why it is planned with ${d.forecast_method}.
            ${d.planned_wo_qty > 0 ? html` On top of that, ${num1(d.planned_wo_qty)}
              ${" " + d.uom} is already on the maintenance schedule for the year
              ahead — that part is known, not predicted.` : ""}
          </p>
          <p>
            The plant's existing rule reorders at <b>${num1(d.min_qty)}</b> and fills to
            ${" "}<b>${num1(d.max_qty)}</b>. We reorder at <b>${num1(d.reorder_point)}</b>
            ${" "}and fill to <b>${num1(d.order_up_to)}</b>${" "}
            ${d.reorder_point > d.min_qty
              ? html`— higher, because being there ${pct(d.service_level)} of the
                     time is what this part's own economics justify.`
              : html`— lower, because the old rule was holding more than this part's
                     own history justifies.`}
          </p>
          <p><q>${d.reason}</q></p>
        </div>

        <h2>Three years of movement, and the year ahead</h2>
        <${UsageChart} usage=${usage} forecast=${fc} planned=${planned}
                       trainMonths=${d.train_months} startMonth=${d.months_start}
                       uom=${d.uom} />

        ${d.elsewhere && d.elsewhere.length > 0 && html`
          <h2>Also kept in other stores</h2>
          <div className="scroller">
            <table>
              <thead><tr><th>Store</th><th className="n">On the shelf</th>
                <th className="n">Our safe level</th><th>State</th>
                <th className="n">Value</th></tr></thead>
              <tbody>${d.elsewhere.map(e => html`
                <tr key=${e.storeroom_id}>
                  <td className="mono">${e.storeroom_id}</td>
                  <td className="n">${num1(e.on_hand)}</td>
                  <td className="n">${num1(e.reorder_point)}</td>
                  <td><${Pill} kind="b" value=${e.band} /></td>
                  <td className="n">${M(e.value_sar)}</td>
                </tr>`)}</tbody>
            </table>
          </div>`}
      </div>`;
  };

  const d = state.d;
  return html`
    <div>
      <div className="scrim" onClick=${onClose}></div>
      <aside className="drawer">
        <div className="dh">
          <button className="x" onClick=${onClose} aria-label="Close">×</button>
          <div className="t">${d ? d.description : id[0]}</div>
          <div className="m">
            ${id[0]} · ${id[1]}
            ${d ? html`<br/>${d.manufacturer} · part number ${d.mpn} · ${d.material_group}
              <br/><span className=${"crit crit-" + d.criticality}>
                ${{ A: "A — the plant stops without it",
                    B: "B — production slows without it",
                    C: "C — somebody waits" }[d.criticality] || d.criticality}</span>
              ${" · takes " + num(d.lead_time_days) + " days to arrive"}
              ${d.lead_time_substituted ? " (the record was not usable — this is the typical figure for this kind of part)" : ""}` : ""}
          </div>
        </div>
        ${inner()}
      </aside>
    </div>`;
}

/* ── shell ────────────────────────────────────────────────────────────────── */
const SCREENS = [
  { key: "", name: "Today" },
  { key: "board", name: "Stock board" },
  { key: "storerooms", name: "Storerooms" },
  { key: "evidence", name: "How well it works" },
];

function parseHash() {
  const parts = (location.hash || "#/").slice(1).split("/").filter(Boolean);
  const screen = SCREENS.some(s => s.key === parts[0]) ? parts[0] : "";
  const open = parts.length >= 3 ? [parts[1], parts[2]] : null;
  return { screen: open ? (screen || "board") : screen, open };
}

function App() {
  const [route, setRoute] = useState(parseHash);
  const [state, setState] = useState({ status: "loading" });

  useEffect(() => {
    const on = () => setRoute(parseHash());
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);

  useEffect(() => {
    Promise.all([
      getJSON("/api/summary"),
      getJSON("/api/scoreboard"),
      getJSON("/api/backtest").catch(() => null),
      getJSON("/api/forecast_scores").catch(() => null),
      getJSON("/api/storerooms").catch(() => null),
      getJSON("/api/frontier").catch(() => null),
    ])
      .then(([summary, score, bt, fc, stores, fr]) =>
        setState({ status: "ready", summary, score, bt, fc, stores, fr }))
      .catch(err => setState({ status: "error", detail: err.message || String(err) }));
  }, []);

  const setOpen = useCallback(id => {
    const base = parseHash().screen || "board";
    location.hash = id ? "#/" + base + "/" + id[0] + "/" + id[1] : "#/" + base;
  }, []);

  if (state.status === "loading")
    return html`<div style=${{ padding: "30px" }}>Loading…</div>`;
  if (state.status === "error")
    return html`<div style=${{ padding: "30px" }}><div className="err">
      <h3>No results to show</h3><div>${state.detail}</div>
      <code>python cli.py all --preset full</code></div></div>`;

  const run = state.summary.run;
  const screen = route.screen;
  const page =
    screen === "board" ? html`<${Board} setOpen=${setOpen} />`
    : screen === "storerooms" ? html`<${Storerooms} stores=${state.stores} setOpen=${setOpen} />`
    : screen === "evidence" ? html`<${Evidence} summary=${state.summary} score=${state.score}
                                                bt=${state.bt} fc=${state.fc} fr=${state.fr} />`
    : html`<${Today} summary=${state.summary} stores=${state.stores} />`;

  return html`
    <div className="shell">
      <nav>
        <div className="brand">
          <div className="mark">Ma'aden Aluminium</div>
          <div className="name">MRO Intelligence</div>
          <div className="sub">Use Case 01 · POC</div>
        </div>
        ${SCREENS.map(s => html`
          <button key=${s.key} className=${"link" + (screen === s.key ? " on" : "")}
                  onClick=${() => { location.hash = "#/" + s.key; }}>${s.name}</button>`)}
        <div className="foot">
          preset ${run.preset}<br/>seed ${run.seed}<br/>git ${run.git_sha}<br/>
          cut-off ${run.cutoff_date}
        </div>
      </nav>
      <main>${page}</main>
      ${route.open && html`<${Drawer} id=${route.open} onClose=${() => setOpen(null)} />`}
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
